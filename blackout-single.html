  <script>
/* =========================================================================
 * BLACKOUT :: ai.js
 * Enemy brains: A* pathfinding on the tile grid, perception (vision cone +
 * line of sight + hearing), memory of the last known position and a finite
 * state machine: IDLE, PATROL, ALERT, INVESTIGATE, CHASE, ATTACK, RETREAT,
 * SEARCH, DEAD. Each archetype has its own combat routine.
 * ========================================================================= */
'use strict';
(function (BO) {
  const U = BO.U;
  const CFG = BO.CONFIG;
  const TILE = CFG.TILE;
  const C = BO.Collision;
  const MODE = BO.COLLIDE;
  const S = BO.ENEMY_STATE;
  const SQRT2 = Math.SQRT2;
  const ALLY_ALERT_RADIUS = 460;
  const SEARCH_DURATION = 8;
  const LOSE_SIGHT_DELAY = 1.2;
  const WAYPOINT_REACHED = 14;

  /* --------------------------------------------------------------------- */
  /* A* pathfinder with typed arrays, a binary heap and generation stamps   */
  /* so no memory is cleared or allocated between searches.                 */
  /* --------------------------------------------------------------------- */
  class Pathfinder {
    constructor(map) {
      this.map = map;
      const n = map.w * map.h;
      this.g = new Float32Array(n);
      this.f = new Float32Array(n);
      this.parent = new Int32Array(n);
      this.seen = new Uint32Array(n);
      this.closed = new Uint32Array(n);
      this.heap = new Int32Array(n * 4);
      this.heapSize = 0;
      this.stamp = 0;
    }

    walkable(tx, ty) { return !this.map.blocks(tx, ty, MODE.PATH); }

    _push(i) {
      const h = this.heap, f = this.f;
      if (this.heapSize >= h.length) return;
      let k = this.heapSize++;
      h[k] = i;
      while (k > 0) {
        const p = (k - 1) >> 1;
        if (f[h[p]] <= f[h[k]]) break;
        const t = h[p]; h[p] = h[k]; h[k] = t; k = p;
      }
    }

    _pop() {
      const h = this.heap, f = this.f;
      const top = h[0];
      const last = h[--this.heapSize];
      if (this.heapSize > 0) {
        h[0] = last;
        let k = 0;
        for (;;) {
          const l = k * 2 + 1, r = l + 1;
          let m = k;
          if (l < this.heapSize && f[h[l]] < f[h[m]]) m = l;
          if (r < this.heapSize && f[h[r]] < f[h[m]]) m = r;
          if (m === k) break;
          const t = h[m]; h[m] = h[k]; h[k] = t; k = m;
        }
      }
      return top;
    }

    _nearestWalkable(tx, ty) {
      if (this.walkable(tx, ty)) return [tx, ty];
      for (let r = 1; r <= 3; r++) {
        for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
          if (this.walkable(tx + dx, ty + dy)) return [tx + dx, ty + dy];
        }
      }
      return null;
    }

    /** Returns an array of world-space waypoints or null. */
    find(sx, sy, gx, gy, maxExpand) {
      const map = this.map, w = map.w;
      const start = this._nearestWalkable(Math.floor(sx / TILE), Math.floor(sy / TILE));
      const goal = this._nearestWalkable(Math.floor(gx / TILE), Math.floor(gy / TILE));
      if (!start || !goal) return null;
      const si = start[1] * w + start[0], gi = goal[1] * w + goal[0];
      if (si === gi) return [{ x: gx, y: gy }];
      this.stamp++;
      const stamp = this.stamp;
      this.heapSize = 0;
      const hx = goal[0], hy = goal[1];
      const heur = (tx, ty) => { const dx = Math.abs(tx - hx), dy = Math.abs(ty - hy); return (dx + dy) + (SQRT2 - 2) * Math.min(dx, dy); };
      this.g[si] = 0; this.f[si] = heur(start[0], start[1]); this.parent[si] = -1; this.seen[si] = stamp;
      this._push(si);
      let expanded = 0;
      const limit = maxExpand || 3000;
      while (this.heapSize > 0 && expanded < limit) {
        const cur = this._pop();
        if (this.closed[cur] === stamp) continue;
        this.closed[cur] = stamp;
        expanded++;
        if (cur === gi) return this._build(gi, gx, gy);
        const cx = cur % w, cy = (cur - cx) / w;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (dx === 0 && dy === 0) continue;
            const nx = cx + dx, ny = cy + dy;
            if (!this.walkable(nx, ny)) continue;
            // No corner cutting: diagonal moves need both orthogonal neighbours free.
            if (dx !== 0 && dy !== 0 && (!this.walkable(cx + dx, cy) || !this.walkable(cx, cy + dy))) continue;
            const ni = ny * w + nx;
            if (this.closed[ni] === stamp) continue;
            const ng = this.g[cur] + (dx !== 0 && dy !== 0 ? SQRT2 : 1);
            if (this.seen[ni] === stamp && ng >= this.g[ni]) continue;
            this.seen[ni] = stamp;
            this.g[ni] = ng;
            this.f[ni] = ng + heur(nx, ny);
            this.parent[ni] = cur;
            this._push(ni);
          }
        }
      }
      return null;
    }

    _build(gi, gx, gy) {
      const w = this.map.w;
      const pts = [];
      let i = gi;
      let guard = 0;
      while (i !== -1 && guard++ < 4000) {
        const tx = i % w, ty = (i - tx) / w;
        pts.push({ x: tx * TILE + TILE / 2, y: ty * TILE + TILE / 2 });
        i = this.parent[i];
      }
      pts.reverse();
      pts.shift(); // drop the start tile
      if (pts.length) { pts[pts.length - 1].x = gx; pts[pts.length - 1].y = gy; }
      return pts;
    }
  }

  /** True if a circle of radius r can travel straight between two points. */
  function clearCorridor(map, x0, y0, x1, y1, r) {
    const dx = x1 - x0, dy = y1 - y0;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    const px = -dy / len * r * 0.9, py = dx / len * r * 0.9;
    return C.lineOfSight(map, x0, y0, x1, y1, MODE.MOVE) &&
      C.lineOfSight(map, x0 + px, y0 + py, x1 + px, y1 + py, MODE.MOVE) &&
      C.lineOfSight(map, x0 - px, y0 - py, x1 - px, y1 - py, MODE.MOVE);
  }

  class AISystem {
    constructor(game) {
      this.game = game;
      this.pathfinder = new Pathfinder(game.map);
      this.pathBudget = 0;
      this.time = 0;
      this._dir = { x: 0, y: 0, arrived: false };
    }

    update(dt) {
      this.time += dt;
      this.pathBudget = CFG.PATH_BUDGET_PER_FRAME;
      const list = this.game.enemies;
      for (let i = 0; i < list.length; i++) {
        const e = list[i];
        if (e.isBoss) continue;
        U.safe('ai.enemy', () => this._updateEnemy(e, dt));
        if (!e.dead && !U.isFiniteNumber(e.x + e.y)) { e.x = e.homeX; e.y = e.homeY; e.setState(S.IDLE); }
      }
      this._separate(list);
    }

    /* --------------------------- Perception --------------------------- */
    _perceive(e) {
      const p = this.game.player;
      e.canSee = false;
      e.clearShot = false;
      if (!p || p.dead) return;
      const dx = p.x - e.x, dy = p.y - e.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      // A player hiding in the dark is harder to spot unless they just fired.
      const lit = this.game.playerExposure > 0;
      const range = e.def.view * (lit || e.engaged ? 1 : 0.72);
      if (d > range) return;
      const inFov = e.engaged || d < 110 || Math.abs(U.angleDiff(e.angle, Math.atan2(dy, dx))) < e.def.fov / 2;
      if (!inFov) return;
      if (!C.lineOfSight(this.game.map, e.x, e.y, p.x, p.y, MODE.SIGHT)) return;
      e.canSee = true;
      e.lastKnownX = p.x; e.lastKnownY = p.y; e.lastSeenAt = this.time;
      e.clearShot = C.lineOfSight(this.game.map, e.x, e.y, p.x, p.y, MODE.BULLET);
      e.playerDist = d;
    }

    _updateAwareness(e, dt) {
      if (e.canSee) {
        const d = e.playerDist || 300;
        const rate = e.engaged ? 10 : (1.1 + 3.6 * (1 - d / e.def.view)) * (e.state === S.INVESTIGATE || e.state === S.SEARCH ? 1.8 : 1);
        e.awareness = Math.min(1, e.awareness + rate * dt);
      } else if (!e.engaged) {
        e.awareness = Math.max(0, e.awareness - 0.12 * dt);
      }
    }

    /* ------------------------------ Events ----------------------------- */
    engage(e) {
      e.awareness = 1;
      if (!e.engaged) {
        e.setState(S.CHASE);
        this.game.onEnemyEngaged(e);
        this._alertAllies(e);
      }
    }

    _alertAllies(src) {
      const list = this.game.enemies;
      for (let i = 0; i < list.length; i++) {
        const o = list[i];
        if (o === src || o.dead || o.isBoss || o.engaged) continue;
        if (U.dist2(o.x, o.y, src.x, src.y) > ALLY_ALERT_RADIUS * ALLY_ALERT_RADIUS) continue;
        o.lastKnownX = src.lastKnownX; o.lastKnownY = src.lastKnownY; o.lastSeenAt = this.time - 0.5;
        o.awareness = 1;
        o.setState(S.CHASE);
      }
    }

    /** Gunshots, explosions and hacking make noise that enemies investigate. */
    onNoise(x, y, radius, fromPlayer) {
      const list = this.game.enemies;
      for (let i = 0; i < list.length; i++) {
        const e = list[i];
        if (e.dead || e.isBoss) continue;
        const d2 = U.dist2(e.x, e.y, x, y);
        if (d2 > radius * radius) continue;
        if (e.engaged) {
          if (fromPlayer && d2 < radius * radius * 0.3) { e.lastKnownX = x; e.lastKnownY = y; e.lastSeenAt = Math.max(e.lastSeenAt, this.time - 0.6); }
          continue;
        }
        e.awareness = Math.max(e.awareness, 0.55);
        e.lastKnownX = x; e.lastKnownY = y;
        e.setState(S.INVESTIGATE);
        e.moveTargetX = x + U.randSpread() * 60;
        e.moveTargetY = y + U.randSpread() * 60;
        e.hasMoveTarget = true;
      }
    }

    onEnemyDamaged(e) {
      if (e.dead) return;
      const p = this.game.player;
      e.lastKnownX = p.x; e.lastKnownY = p.y; e.lastSeenAt = this.time;
      this.engage(e);
    }

    /* ---------------------------- Main loop ---------------------------- */
    _updateEnemy(e, dt) {
      if (e.dead) { e.deathTime += dt; e.removeTimer -= dt; return; }
      e.hitFlash = Math.max(0, e.hitFlash - dt);
      e.barTimer = Math.max(0, e.barTimer - dt);
      e.meleeCooldown = Math.max(0, e.meleeCooldown - dt);
      e.muzzle = Math.max(0, e.muzzle - dt * 8);
      e.stateTime += dt;
      e.pathAge += dt;
      e.perceptionTimer -= dt;
      if (e.perceptionTimer <= 0) { e.perceptionTimer = CFG.PERCEPTION_INTERVAL; this._perceive(e); }
      this._updateAwareness(e, dt);

      e.desiredX = 0; e.desiredY = 0; e.speedMul = 0; e.faceAngle = null;
      switch (e.state) {
        case S.IDLE: this._idle(e, dt); break;
        case S.PATROL: this._patrol(e, dt); break;
        case S.ALERT: this._alert(e, dt); break;
        case S.INVESTIGATE: this._investigate(e, dt); break;
        case S.CHASE: this._chase(e, dt); break;
        case S.ATTACK: this._attack(e, dt); break;
        case S.RETREAT: this._retreat(e, dt); break;
        case S.SEARCH: this._search(e, dt); break;
        default: e.setState(S.IDLE); // unknown state recovers safely
      }
      this._applyMovement(e, dt);
    }

    _checkSpotted(e) {
      if (!e.canSee) return false;
      if (e.awareness >= 1) { this.engage(e); return true; }
      if (e.awareness > 0.15 && e.state !== S.ALERT) { e.setState(S.ALERT); return true; }
      return false;
    }

    _idle(e, dt) {
      e.timer -= dt;
      e.faceAngle = e.lookAngle + Math.sin(e.stateTime * 0.8) * 0.9;
      if (this._checkSpotted(e)) return;
      if (e.timer <= 0) {
        e.timer = U.rand(1.5, 3.5);
        if (e.patrol.length) e.setState(S.PATROL);
        else e.lookAngle += U.rand(-1.5, 1.5);
      }
    }

    _patrol(e, dt) {
      if (this._checkSpotted(e)) return;
      const pt = e.patrol[e.patrolIndex % e.patrol.length];
      if (!pt) { e.setState(S.IDLE); return; }
      if (this._navigate(e, pt.x, pt.y, 0.45) || e.stateTime > 15) {
        e.patrolIndex = (e.patrolIndex + 1) % e.patrol.length;
        e.lookAngle = e.angle;
        e.timer = U.rand(1.2, 3);
        e.setState(S.IDLE);
      }
    }

    _alert(e, dt) {
      e.faceAngle = Math.atan2(e.lastKnownY - e.y, e.lastKnownX - e.x);
      if (e.awareness >= 1) { this.engage(e); return; }
      if ((!e.canSee && e.stateTime > 1.2) || e.stateTime > 4) {
        e.setState(S.INVESTIGATE);
        e.moveTargetX = e.lastKnownX; e.moveTargetY = e.lastKnownY; e.hasMoveTarget = true;
      }
    }

    _investigate(e, dt) {
      if (e.canSee && e.awareness > 0.5) { this.engage(e); return; }
      if (!e.hasMoveTarget) { e.moveTargetX = e.lastKnownX; e.moveTargetY = e.lastKnownY; e.hasMoveTarget = true; }
      if (this._navigate(e, e.moveTargetX, e.moveTargetY, 0.7) || e.stateTime > 12) e.setState(S.SEARCH);
    }

    _chase(e, dt) {
      const p = this.game.player;
      if (p.dead) { e.setState(S.SEARCH); return; }
      const tx = e.canSee ? p.x : e.lastKnownX, ty = e.canSee ? p.y : e.lastKnownY;
      const d = U.dist(e.x, e.y, p.x, p.y);
      if (e.canSee) {
        const attackRange = e.type === 'rusher' ? 240 : e.def.range * 0.92;
        if (d <= attackRange && (e.clearShot || e.type === 'rusher')) { this._enterAttack(e); return; }
      }
      const arrived = this._navigate(e, tx, ty, e.type === 'heavy' ? 1 : 0.95);
      if (!e.canSee && (arrived || this.time - e.lastSeenAt > 9)) { e.setState(S.SEARCH); }
    }

    _enterAttack(e) {
      e.setState(S.ATTACK);
      e.fireTimer = Math.max(e.fireTimer, e.type === 'grunt' ? 0.4 : 0.2);
      e.repositionTimer = U.rand(1.5, 3);
    }

    _attack(e, dt) {
      const p = this.game.player;
      if (p.dead) { e.setState(S.SEARCH); return; }
      if (!e.canSee && this.time - e.lastSeenAt > (e.type === 'rusher' ? 0.6 : LOSE_SIGHT_DELAY)) {
        e.charge = 0; e.spin = 0; e.sprayLeft = 0; e.windup = 0;
        e.setState(S.CHASE);
        return;
      }
      const d = U.dist(e.x, e.y, p.x, p.y);
      if (e.type === 'grunt' && !e.retreated && e.hp / e.maxHp < e.def.retreatAt) { this._startRetreat(e); return; }
      if (e.type === 'sniper' && d < e.def.minRange && e.canSee) { this._startRetreat(e); return; }
      switch (e.type) {
        case 'rusher': this._rusherCombat(e, dt, p, d); break;
        case 'heavy': this._heavyCombat(e, dt, p, d); break;
        case 'sniper': this._sniperCombat(e, dt, p, d); break;
        default: this._gruntCombat(e, dt, p, d);
      }
    }

    _startRetreat(e) {
      e.retreated = true;
      e.charge = 0;
      const pt = this._findPoint(e, 'hidden');
      e.setState(S.RETREAT);
      if (pt) { e.moveTargetX = pt.x; e.moveTargetY = pt.y; e.hasMoveTarget = true; }
    }

    _retreat(e, dt) {
      if (!e.hasMoveTarget) { e.setState(S.CHASE); return; }
      const arrived = this._navigate(e, e.moveTargetX, e.moveTargetY, 1.1);
      if (arrived) e.faceAngle = Math.atan2(e.lastKnownY - e.y, e.lastKnownX - e.x);
      if ((arrived && e.stateTime > 1.8) || e.stateTime > 5) {
        if (e.type === 'sniper') e.retreated = false;
        if (e.canSee && e.clearShot) this._enterAttack(e);
        else e.setState(S.CHASE);
      }
    }

    _search(e, dt) {
      if (e.canSee && e.awareness > 0.4) { this.engage(e); return; }
      e.awareness = Math.min(e.awareness, 0.6);
      if (!e.hasMoveTarget) {
        const pt = this._randomFloorNear(e.lastKnownX, e.lastKnownY, 5);
        if (pt) { e.moveTargetX = pt.x; e.moveTargetY = pt.y; e.hasMoveTarget = true; }
      }
      if (e.hasMoveTarget && this._navigate(e, e.moveTargetX, e.moveTargetY, 0.6)) {
        e.hasMoveTarget = false;
        e.lookAngle = e.angle;
      }
      if (!e.hasMoveTarget) e.faceAngle = e.lookAngle + Math.sin(e.stateTime * 3) * 1.2;
      if (e.stateTime > SEARCH_DURATION) {
        e.awareness = 0.1;
        e.retreated = false;
        if (e.isWave) {
          // Wave attackers keep hunting; they know roughly where the player is.
          e.lastKnownX = this.game.player.x; e.lastKnownY = this.game.player.y;
          e.setState(S.INVESTIGATE);
        } else e.setState(e.patrol.length ? S.PATROL : S.IDLE);
      }
    }

    /* --------------------------- Archetypes --------------------------- */
    _gruntCombat(e, dt, p, d) {
      e.faceAngle = Math.atan2(p.y - e.y, p.x - e.x);
      e.repositionTimer -= dt;
      if (e.canSee && !e.clearShot) e.repositionTimer = Math.min(e.repositionTimer, 0.4);
      if (e.repositionTimer <= 0) {
        e.repositionTimer = U.rand(2.5, 4.5);
        const pt = this._findPoint(e, 'fight');
        if (pt) { e.moveTargetX = pt.x; e.moveTargetY = pt.y; e.hasMoveTarget = true; }
      }
      if (e.hasMoveTarget) {
        if (this._navigate(e, e.moveTargetX, e.moveTargetY, 0.75)) e.hasMoveTarget = false;
        e.faceAngle = Math.atan2(p.y - e.y, p.x - e.x);
      } else {
        this._strafe(e, dt, p, d, 0.5);
      }
      this._burstFire(e, dt);
    }

    _strafe(e, dt, p, d, speed) {
      e.strafeTimer -= dt;
      if (e.strafeTimer <= 0) { e.strafeTimer = U.rand(0.8, 2); e.strafeDir *= -1; }
      const ax = (p.x - e.x) / (d || 1), ay = (p.y - e.y) / (d || 1);
      const radial = U.clamp((d - e.def.prefRange) / 120, -1, 1);
      e.desiredX = -ay * e.strafeDir + ax * radial;
      e.desiredY = ax * e.strafeDir + ay * radial;
      e.speedMul = speed;
    }

    _burstFire(e, dt) {
      e.fireTimer -= dt;
      if (e.fireTimer > 0) return;
      const aimed = Math.abs(U.angleDiff(e.angle, e.faceAngle === null ? e.angle : e.faceAngle)) < 0.3;
      if (e.burstLeft > 0) {
        this._shoot(e, e.def.spread, e.def.damage, e.def.bulletSpeed, BO.PROJECTILE_KIND.TRACER, '#ff3355', 2);
        e.burstLeft--;
        e.fireTimer = e.burstLeft > 0 ? e.def.fireInterval : U.rand(e.def.burstPause[0], e.def.burstPause[1]);
      } else if (e.canSee && e.clearShot && aimed) {
        e.burstLeft = e.def.burst;
      }
    }

    _rusherCombat(e, dt, p, d) {
      const reach = e.def.meleeRange + e.r + p.r;
      if (e.lunge > 0) {
        e.lunge -= dt;
        e.desiredX = Math.cos(e.lockedAngle); e.desiredY = Math.sin(e.lockedAngle);
        e.speedMul = 1.9;
        e.faceAngle = e.lockedAngle;
        if (!e.meleeHit && d < reach) {
          e.meleeHit = true;
          this.game.onPlayerMelee(e, e.def.meleeDamage * e.diff.damage);
        }
        if (e.lunge <= 0) e.meleeCooldown = e.def.meleeCooldown;
        return;
      }
      if (e.windup > 0) {
        e.windup -= dt;
        e.faceAngle = Math.atan2(p.y - e.y, p.x - e.x);
        if (e.windup <= 0) {
          e.lunge = 0.17;
          e.lockedAngle = e.angle;
          e.meleeHit = false;
          this.game.audio.melee(e.x, e.y);
        }
        return;
      }
      if (e.meleeCooldown <= 0 && d < reach + 26) { e.windup = e.def.windup; return; }
      // Zig-zag approach makes rushers harder to track.
      const zig = Math.sin(e.stateTime * 7 + e.id) * 0.55;
      const ax = (p.x - e.x) / (d || 1), ay = (p.y - e.y) / (d || 1);
      if (e.canSee && clearCorridor(this.game.map, e.x, e.y, p.x, p.y, e.r)) {
        e.desiredX = ax - ay * zig; e.desiredY = ay + ax * zig;

        e.faceAngle = Math.atan2(p.y - e.y, p.x - e.x);
      } else {
        this._navigate(e, p.x, p.y, 1);
      }
    }

    _heavyCombat(e, dt, p, d) {
      e.faceAngle = Math.atan2(p.y - e.y, p.x - e.x);
      if (d > e.def.prefRange) this._navigate(e, p.x, p.y, e.sprayLeft > 0 ? 0.55 : 1);
      else this._strafe(e, dt, p, d, 0.3);
      if (e.sprayLeft > 0) {
        e.sprayLeft -= dt;
        e.fireTimer -= dt;
        if (e.fireTimer <= 0) {
          e.fireTimer = e.def.fireInterval;
          this._shoot(e, e.def.spread, e.def.damage, e.def.bulletSpeed, BO.PROJECTILE_KIND.TRACER, '#ff4a3d', 2.6);
        }
        if (e.sprayLeft <= 0) { e.spin = 0; e.sprayCooldown = e.def.sprayCooldown; }

      }

      }
    }

    _sniperCombat(e, dt, p, d) {
      const toPlayer = Math.atan2(p.y - e.y, p.x - e.x);
      const lockAt = e.def.chargeTime - e.def.lockTime;
      if (e.charge < lockAt) e.faceAngle = toPlayer;
      else e.faceAngle = e.lockedAngle;
      if (e.hasMoveTarget) {
        if (this._navigate(e, e.moveTargetX, e.moveTargetY, 0.9)) e.hasMoveTarget = false;
        e.charge = 0;
        return;
      }
      if (e.shotCooldown > 0) { e.shotCooldown -= dt; e.charge = 0; return; }
      if ((e.canSee && e.clearShot) || e.charge >= lockAt) {
        const before = e.charge;
        e.charge += dt;
        this.game.audio.sniperCharge(e.x, e.y, e.charge / e.def.chargeTime);
        if (before < lockAt && e.charge >= lockAt) e.lockedAngle = e.angle;
        if (e.charge >= e.def.chargeTime) {
          e.angle = e.lockedAngle;
          this._shoot(e, e.def.spread, e.def.damage, e.def.bulletSpeed, BO.PROJECTILE_KIND.SNIPER, '#ff2d55', 3);
          e.charge = 0;
          e.shotCooldown = e.def.shotCooldown;
          if (U.chance(0.45)) {
            const pt = this._findPoint(e, 'fight');
            if (pt) { e.moveTargetX = pt.x; e.moveTargetY = pt.y; e.hasMoveTarget = true; }
          }
        }
      } else {
        e.charge = Math.max(0, e.charge - dt * 2);
      }
    }

    _shoot(e, spread, damage, speed, kind, color, width) {
      const acc = e.diff.accuracy || 1;
      const a = e.angle + U.randSpread() * spread / acc;
      const S2 = BO.SHOT;
      const off = e.r + (e.def.weaponLen || 10);
      S2.x = e.x + Math.cos(e.angle) * off; S2.y = e.y + Math.sin(e.angle) * off;
      const block = C.raycast(this.game.map, e.x, e.y, S2.x, S2.y, MODE.BULLET);
      if (block.hit) { S2.x = e.x; S2.y = e.y; }

      S2.owner = BO.PROJECTILE_OWNER.ENEMY; S2.kind = kind; S2.color = color; S2.width = width;
      S2.pierce = 0; S2.explosive = 0; S2.knockback = 40; S2.hitStop = 0; S2.critChance = 0; S2.source = e; S2.radius = 2;
      this.game.projectiles.spawn(S2);

      this.game.onEnemyFired(e, S2.x, S2.y, e.angle);
    }

    /* --------------------------- Navigation --------------------------- */
    /** Steers towards a world point. Returns true once arrived. */
    _navigate(e, tx, ty, speedMul) {
      const dx = tx - e.x, dy = ty - e.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < WAYPOINT_REACHED) return true;
      e.speedMul = speedMul;
      const map = this.game.map;
      if (d < 280 && clearCorridor(map, e.x, e.y, tx, ty, e.r)) {
        e.path = null;
        e.desiredX = dx / d; e.desiredY = dy / d;
        return false;
      }
      const goalMoved = U.dist2(e.pathGoalX, e.pathGoalY, tx, ty) > (TILE * 1.5) * (TILE * 1.5);
      if ((!e.path || goalMoved || e.pathAge > 2.5) && this.pathBudget > 0) {
        this.pathBudget--;
        e.path = this.pathfinder.find(e.x, e.y, tx, ty, 2600);
        e.pathIndex = 0; e.pathAge = 0; e.pathGoalX = tx; e.pathGoalY = ty;
      }
      if (e.path && e.path.length) {
        // Skip ahead to the furthest directly reachable waypoint (cheap smoothing).
        if (e.pathIndex + 1 < e.path.length) {
          const nxt = e.path[e.pathIndex + 1];
          if (clearCorridor(map, e.x, e.y, nxt.x, nxt.y, e.r)) e.pathIndex++;
        }
        let wp = e.path[e.pathIndex];
        if (U.dist2(e.x, e.y, wp.x, wp.y) < WAYPOINT_REACHED * WAYPOINT_REACHED) {
          e.pathIndex++;
          if (e.pathIndex >= e.path.length) { e.path = null; return d < TILE; }
          wp = e.path[e.pathIndex];
        }
        const wx = wp.x - e.x, wy = wp.y - e.y;
        const wl = Math.sqrt(wx * wx + wy * wy) || 1;
        e.desiredX = wx / wl; e.desiredY = wy / wl;
        return false;
      }
      e.desiredX = dx / d; e.desiredY = dy / d;
      if (e.pathAge > 1 && e.stateTime > 6 && d < TILE * 2) return true;
      return false;
    }

    _randomFloorNear(x, y, radiusTiles) {
      const map = this.game.map;
      const cx = Math.floor(x / TILE), cy = Math.floor(y / TILE);
      for (let i = 0; i < 14; i++) {
        const tx = cx + U.randInt(-radiusTiles, radiusTiles), ty = cy + U.randInt(-radiusTiles, radiusTiles);
        if (!this.pathfinder.walkable(tx, ty)) continue;
        const wx = tx * TILE + TILE / 2, wy = ty * TILE + TILE / 2;
        if (C.lineOfSight(map, x, y, wx, wy, MODE.SIGHT) || i > 8) return { x: wx, y: wy };
      }
      return null;
    }

    /**
     * Tactical point selection.
     * 'fight'  : near the preferred range, with a clear shot, preferably beside cover.
     * 'hidden' : out of the player's line of fire (for retreating / regrouping).
     */
    _findPoint(e, kind) {
      const map = this.game.map, p = this.game.player;
      const cx = Math.floor(e.x / TILE), cy = Math.floor(e.y / TILE);
      let best = null, bestScore = -1e9;
      for (let i = 0; i < 16; i++) {
        const rr = U.randInt(2, kind === 'hidden' ? 8 : 6);
        const a = Math.random() * U.TAU;
        const tx = cx + Math.round(Math.cos(a) * rr), ty = cy + Math.round(Math.sin(a) * rr);
        if (!this.pathfinder.walkable(tx, ty)) continue;
        const wx = tx * TILE + TILE / 2, wy = ty * TILE + TILE / 2;
        if (!map.isCircleFree(wx, wy, e.r)) continue;
        const dp = U.dist(wx, wy, p.x, p.y);
        const exposed = C.lineOfSight(map, p.x, p.y, wx, wy, MODE.BULLET);
        const nearCover = this._adjacentCover(tx, ty);
        let score = -U.dist(e.x, e.y, wx, wy) / 400 + Math.random() * 0.4;
        if (kind === 'hidden') score += (exposed ? 0 : 3) + dp / 400 + (nearCover ? 0.5 : 0);
        else score += (exposed ? 2.2 : 0) - Math.abs(dp - e.def.prefRange) / 140 + (nearCover ? 1 : 0);
        if (score > bestScore) { bestScore = score; best = { x: wx, y: wy }; }
      }
      return best;
    }

    _adjacentCover(tx, ty) {
      const map = this.game.map;
      return map.blocks(tx + 1, ty, MODE.BULLET) || map.blocks(tx - 1, ty, MODE.BULLET) ||
        map.blocks(tx, ty + 1, MODE.BULLET) || map.blocks(tx, ty - 1, MODE.BULLET);
    }

    _applyMovement(e, dt) {
      const speed = e.def.speed * (e.speedMul || 0);
      e.vx = U.damp(e.vx, e.desiredX * speed, 10, dt);
      e.vy = U.damp(e.vy, e.desiredY * speed, 10, dt);
      e.kx = U.damp(e.kx, 0, 9, dt);
      e.ky = U.damp(e.ky, 0, 9, dt);
      C.moveCircle(this.game.map, e, (e.vx + e.kx) * dt, (e.vy + e.ky) * dt, e.r);
      let face = e.faceAngle;
      const mv = Math.abs(e.vx) + Math.abs(e.vy);
      if (face === null && mv > 8) face = Math.atan2(e.vy, e.vx);
      if (face !== null) e.angle = U.turnTowards(e.angle, face, e.def.turn * dt);
      e.walk += mv * dt * 0.06;
    }

    /** Soft separation so squads do not stack into one blob, and do not overlap the player. */
    _separate(list) {
      const p = this.game.player;
      for (let i = 0; i < list.length; i++) {
        const a = list[i];
        if (a.dead) continue;
        for (let j = i + 1; j < list.length; j++) {
          const b = list[j];
          if (b.dead) continue;
          const dx = b.x - a.x, dy = b.y - a.y;
          const min = a.r + b.r + 4;
          const d2 = dx * dx + dy * dy;
          if (d2 >= min * min || d2 < 1e-4) continue;
          const d = Math.sqrt(d2), push = (min - d) * 0.5;
          const wa = a.isBoss ? 0 : 1, wb = b.isBoss ? 0 : 1;
          a.x -= dx / d * push * wa; a.y -= dy / d * push * wa;
          b.x += dx / d * push * wb; b.y += dy / d * push * wb;
        }
        if (p && !p.dead) {
          const dx = a.x - p.x, dy = a.y - p.y;
          const min = a.r + p.r;
          const d2 = dx * dx + dy * dy;
          if (d2 < min * min && d2 > 1e-4) {
            const d = Math.sqrt(d2), push = min - d;
            if (a.isBoss) { p.x -= dx / d * push; p.y -= dy / d * push; }
            else { a.x += dx / d * push * 0.6; a.y += dy / d * push * 0.6; p.x -= dx / d * push * 0.4; p.y -= dy / d * push * 0.4; }
          }
        }
      }
    }
  }

  BO.Pathfinder = Pathfinder;
  BO.AISystem = AISystem;
  BO.clearCorridor = clearCorridor;
})(window.BO);

  <script>
/* =========================================================================
 * BLACKOUT :: boss.js
 * THE WARDEN. Three phases, six telegraphed attacks, minion spawning,
 * arena hazards, phase transitions and a cinematic death.
 * ========================================================================= */
'use strict';
(function (BO) {
  const U = BO.U;
  const TILE = BO.CONFIG.TILE;
  const C = BO.Collision;
  const ORB = BO.PROJECTILE_KIND.ORB;
  const COLOR = '#ff2d55';
  const PHASE_SPEED = [0, 85, 110, 175];
  const PHASE_COOLDOWN = [0, 1.35, 1.0, 0.7];
  const PHASE_ATTACKS = [
    [],
    ['fan', 'stream', 'fan'],
    ['fan', 'stream', 'mortar', 'summon', 'mortar'],
    ['fan', 'mortar', 'nova', 'charge', 'nova', 'charge', 'summon']
  ];
  const TELEGRAPH = { fan: 0.6, stream: 0.45, mortar: 0.5, summon: 0.9, nova: 0.95, charge: 0.85 };
  const MAX_MINIONS = 4;

  class Boss {
    constructor(x, y, arena, mk2) {
      this.isBoss = true;
      this.type = 'boss';
      this.mk2 = !!mk2;
      this.def = { color: COLOR, knockResist: 0.04, xp: mk2 ? 900 : 600, credits: [160, 220], r: 40 };
      this.x = x; this.y = y;
      this.r = 40;
      this.maxHp = mk2 ? 9500 : 6500;
      this.hp = this.maxHp;
      this.arena = arena; // world rect {x, y, w, h}
      this.angle = Math.PI;
      this.phase = 1;
      this.mode = 'dormant';
      this.modeTime = 0;
      this.attack = null;
      this.cooldown = 2;
      this.lastAttack = '';
      this.moveX = x; this.moveY = y; this.moveTimer = 0;
      this.vx = 0; this.vy = 0; this.kx = 0; this.ky = 0;
      this.hitFlash = 0; this.dead = false; this.deathTime = 0; this.removeTimer = 999;
      this.fieldTimer = 4;
      this.stun = 0;
      this.ringSpin = 0;
      this.visible = true;
      this.shieldFlash = 0;
      this.minions = [];
    }

    get engaged() { return this.mode === 'fight'; }
    get invulnerable() { return this.mode !== 'fight'; }

    activate(game) {
      if (this.mode !== 'dormant') return;
      this.mode = 'intro';
      this.modeTime = 0;
      game.onBossIntro(this);
    }

    takeDamage(amount, kx, ky) {
      if (this.dead) return false;
      if (this.invulnerable) { this.shieldFlash = 0.15; return false; }
      this.hp -= amount * (this.stun > 0 ? 1.5 : 1);
      this.hitFlash = 0.06;
      if (this.hp <= 0) {
        this.hp = 0;
        this.dead = true;
        this.mode = 'dying';
        this.deathTime = 0;
        return true;
      }
      return false;
    }

    update(dt, game) {
      this.modeTime += dt;
      this.hitFlash = Math.max(0, this.hitFlash - dt);
      this.shieldFlash = Math.max(0, this.shieldFlash - dt);
      this.ringSpin += dt * (0.6 + this.phase * 0.5);
      if (this.dead) { this.deathTime += dt; return; }
      const p = game.player;
      if (this.mode === 'dormant') return;
      if (this.mode === 'intro') {
        this.angle = U.turnTowards(this.angle, Math.atan2(p.y - this.y, p.x - this.x), dt * 2);
        if (this.modeTime > 2.2) { this.mode = 'fight'; this.modeTime = 0; }
        return;
      }
      if (this.mode === 'transition') {
        if (this.modeTime > 1.7) { this.mode = 'fight'; this.modeTime = 0; this.cooldown = 0.6; }
        return;
      }
      this._checkPhase(game);
      if (this.mode !== 'fight') return;
      this.stun = Math.max(0, this.stun - dt);
      if (this.stun > 0) return;
      this._updateMovement(dt, game, p);
      this._updateAttacks(dt, game, p);
      if (this.phase === 3) this._updateArenaFields(dt, game);
    }

    _checkPhase(game) {
      const frac = this.hp / this.maxHp;
      const target = frac <= 0.33 ? 3 : (frac <= 0.66 ? 2 : 1);
      if (target <= this.phase) return;
      this.phase = target;
      this.mode = 'transition';
      this.modeTime = 0;
      this.attack = null;
      game.onBossPhase(this, target);
    }

    _updateMovement(dt, game, p) {
      if (this.attack && this.attack.name === 'charge' && this.attack.stage === 'dash') return;
      this.moveTimer -= dt;
      const a = this.arena;
      const margin = TILE * 2.5;
      if (this.moveTimer <= 0 || U.dist(this.x, this.y, this.moveX, this.moveY) < 20) {
        this.moveTimer = U.rand(1.6, 3.2);
        if (this.phase === 3 && U.chance(0.6)) {
          this.moveX = U.clamp(p.x + U.randSpread() * 140, a.x + margin, a.x + a.w - margin);
          this.moveY = U.clamp(p.y + U.randSpread() * 140, a.y + margin, a.y + a.h - margin);
        } else {
          this.moveX = U.rand(a.x + margin, a.x + a.w - margin);
          this.moveY = U.rand(a.y + margin, a.y + a.h - margin);
        }
      }
      const slow = this.attack && (this.attack.name === 'stream' || this.attack.stage === 'tele') ? 0.4 : 1;
      const dx = this.moveX - this.x, dy = this.moveY - this.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const sp = PHASE_SPEED[this.phase] * slow * (this.mk2 ? 1.1 : 1);
      this.vx = U.damp(this.vx, dx / d * sp, 4, dt);
      this.vy = U.damp(this.vy, dy / d * sp, 4, dt);
      this.kx = U.damp(this.kx, 0, 8, dt); this.ky = U.damp(this.ky, 0, 8, dt);
      C.moveCircle(game.map, this, (this.vx + this.kx) * dt, (this.vy + this.ky) * dt, this.r);
      if (!this.attack || this.attack.stage !== 'tele' || this.attack.name !== 'charge') {
        this.angle = U.turnTowards(this.angle, Math.atan2(p.y - this.y, p.x - this.x), dt * (1.6 + this.phase * 0.6));
      }
    }

    _updateAttacks(dt, game, p) {
      if (!this.attack) {
        this.cooldown -= dt;
        if (this.cooldown > 0) return;
        const pool = PHASE_ATTACKS[this.phase];
        let name = U.pick(pool);
        if (name === this.lastAttack) name = U.pick(pool);
        if (name === 'summon' && this._aliveMinions() >= MAX_MINIONS) name = 'fan';
        this.lastAttack = name;
        this.attack = { name, stage: 'tele', t: 0, shots: 0, timer: 0, aim: Math.atan2(p.y - this.y, p.x - this.x) };
        game.audio.telegraph();
        return;
      }
      const atk = this.attack;
      atk.t += dt;
      if (atk.stage === 'tele') {
        if (atk.name === 'charge' || atk.name === 'fan') {
          if (atk.name === 'fan' || atk.t < TELEGRAPH.charge * 0.6) atk.aim = U.turnTowards(atk.aim, Math.atan2(p.y - this.y, p.x - this.x), dt * 3);
          if (atk.name === 'charge') this.angle = atk.aim;
        }
        if (atk.t >= TELEGRAPH[atk.name]) { atk.stage = 'run'; atk.t = 0; this._beginAttack(atk, game, p); }
        return;
      }
      switch (atk.name) {
        case 'fan': this._runFan(atk, dt, game, p); break;
        case 'stream': this._runStream(atk, dt, game, p); break;
        case 'nova': this._runNova(atk, dt, game); break;
        case 'charge': this._runCharge(atk, dt, game, p); break;
        default: if (atk.t > 0.6) this._endAttack();
      }
    }

    _beginAttack(atk, game, p) {
      if (atk.name === 'mortar') {
        const n = this.phase === 3 ? 7 : 5;
        game.hazards.addStrike(p.x + p.vx * 0.4, p.y + p.vy * 0.4, 88, 1.25, 30);
        for (let i = 1; i < n; i++) {
          const a = Math.random() * U.TAU, r = U.rand(110, 280);
          game.hazards.addStrike(p.x + Math.cos(a) * r, p.y + Math.sin(a) * r, 80, 1.25 + i * 0.12, 28);
        }
      } else if (atk.name === 'summon') {
        const count = Math.min(MAX_MINIONS - this._aliveMinions(), this.phase === 3 ? 3 : 2);
        for (let i = 0; i < count; i++) {
          const type = this.phase === 3 && i === 0 ? 'heavy' : (U.chance(0.5) ? 'rusher' : 'grunt');
          const m = game.spawnBossMinion(type, this);
          if (m) this.minions.push(m);
        }
      } else if (atk.name === 'charge') {
        atk.stage = 'dash';
        atk.hit = false;
        game.audio.melee(this.x, this.y);
      } else if (atk.name === 'stream') {
        atk.aim = this.angle;
      }
    }

    _aliveMinions() {
      let n = 0;
      for (let i = 0; i < this.minions.length; i++) if (!this.minions[i].dead) n++;
      return n;
    }

    _endAttack() {
      this.attack = null;
      this.cooldown = PHASE_COOLDOWN[this.phase] * (this.mk2 ? 0.85 : 1);
    }

    _orb(game, angle, speed, damage, color) {
      const S = BO.SHOT;
      S.x = this.x + Math.cos(angle) * (this.r + 6); S.y = this.y + Math.sin(angle) * (this.r + 6);
      S.angle = angle; S.speed = speed; S.damage = damage; S.range = 1500;
      S.owner = BO.PROJECTILE_OWNER.ENEMY; S.kind = ORB; S.color = color || COLOR; S.width = 3;
      S.pierce = 0; S.explosive = 0; S.knockback = 60; S.hitStop = 0; S.critChance = 0; S.source = this; S.radius = 5;
      game.projectiles.spawn(S);
    }

    _runFan(atk, dt, game) {
      atk.timer -= dt;
      if (atk.timer > 0) return;
      const volleys = this.phase === 3 ? 4 : 3;
      const count = this.phase === 1 ? 7 : 9;
      const spreadA = 1.15;
      const speed = 420 + this.phase * 50;
      for (let i = 0; i < count; i++) {
        const a = atk.aim - spreadA / 2 + spreadA * (i / (count - 1)) + (atk.shots % 2 ? spreadA / (count - 1) / 2 : 0);
        this._orb(game, a, speed, 12);
      }
      game.onBossFired(this);
      atk.shots++;
      atk.timer = 0.28;
      if (atk.shots >= volleys) this._endAttack();
    }

    _runStream(atk, dt, game, p) {
      atk.aim = U.turnTowards(atk.aim, Math.atan2(p.y - this.y, p.x - this.x), dt * (1.3 + this.phase * 0.4));
      this.angle = atk.aim;
      atk.timer -= dt;
      if (atk.timer <= 0) {
        atk.timer = this.phase === 1 ? 1 / 11 : 1 / 15;
        this._orb(game, atk.aim + U.randSpread() * 0.06, 560, 8, '#ff6b81');
        if (atk.shots++ % 3 === 0) game.onBossFired(this);
      }
      if (atk.t > 1.9) this._endAttack();
    }

    _runNova(atk, dt, game) {
      atk.timer -= dt;
      if (atk.timer > 0) return;
      const count = 28;
      const offset = atk.shots * (Math.PI / count) + this.ringSpin;
      for (let i = 0; i < count; i++) this._orb(game, offset + i / count * U.TAU, 300, 14, '#ffd0d8');
      game.onBossFired(this, true);
      atk.shots++;
      atk.timer = 0.38;
      if (atk.shots >= 3) this._endAttack();
    }

    _runCharge(atk, dt, game, p) {
      if (atk.stage === 'dash') {
        const sp = 960;
        const hit = C.moveCircle(game.map, this, Math.cos(atk.aim) * sp * dt, Math.sin(atk.aim) * sp * dt, this.r);
        if (Math.random() < 0.6) game.particles.dust(this.x, this.y, 2);
        if (!atk.hit && U.dist(this.x, this.y, p.x, p.y) < this.r + p.r + 6) {
          atk.hit = true;
          p.takeDamage(34, this.x, this.y, game);
          p.knock(Math.cos(atk.aim) * 700, Math.sin(atk.aim) * 700);
        }
        if (hit || atk.t > 0.95) {
          atk.stage = 'recover';
          atk.t = 0;
          this.stun = 0.9;
          game.onBossSlam(this);
        }
        return;
      }
      if (atk.t > 0.1) this._endAttack();
    }

    _updateArenaFields(dt, game) {
      this.fieldTimer -= dt;
      if (this.fieldTimer > 0) return;
      this.fieldTimer = this.mk2 ? 5.5 : 7;
      const a = this.arena;
      for (let i = 0; i < 3; i++) {
        const w = TILE * 2, h = TILE * 2;
        const x = Math.floor(U.rand(a.x + TILE, a.x + a.w - w - TILE) / TILE) * TILE;
        const y = Math.floor(U.rand(a.y + TILE, a.y + a.h - h - TILE) / TILE) * TILE;
        game.hazards.addField(x, y, w, h, 1.3, 2.6, 24);
      }
    }

    /* ------------------------------ Render ------------------------------ */
    draw(ctx, time) {
      if (this.dead && this.removeTimer <= 0) return;
      const r = this.r;
      const coreColor = this.phase === 1 ? '#ff8a1a' : (this.phase === 2 ? '#ff2d55' : '#ffe0e6');
      const deathShake = this.dead ? U.randSpread() * 4 : 0;
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.beginPath(); ctx.ellipse(this.x + 6, this.y + 10, r * 1.25, r * 1.05, 0, 0, U.TAU); ctx.fill();
      ctx.save();
      ctx.translate(this.x + deathShake, this.y + deathShake);
      // Rotating armour ring.
      ctx.save();
      ctx.rotate(this.ringSpin);
      ctx.fillStyle = this.hitFlash > 0 ? '#ffffff' : '#2a2530';
      for (let i = 0; i < 6; i++) {
        ctx.rotate(U.TAU / 6);
        ctx.fillRect(r * 0.75, -r * 0.28, r * 0.42, r * 0.56);
      }
      ctx.restore();
      ctx.rotate(this.angle);
      // Twin cannons.
      ctx.fillStyle = '#17181e';
      ctx.fillRect(r * 0.3, -r * 0.62, r * 1.05, r * 0.3);
      ctx.fillRect(r * 0.3, r * 0.32, r * 1.05, r * 0.3);
      ctx.fillStyle = this.hitFlash > 0 ? '#ffffff' : '#3a3240';
      ctx.beginPath();
      for (let i = 0; i < 8; i++) { const a = i / 8 * U.TAU; ctx.lineTo(Math.cos(a) * r * 0.85, Math.sin(a) * r * 0.85); }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#4b4152';
      ctx.beginPath(); ctx.arc(0, 0, r * 0.55, 0, U.TAU); ctx.fill();
      const pulse = 0.6 + Math.sin(time * (4 + this.phase * 2)) * 0.4;
      ctx.fillStyle = U.rgba(coreColor, 0.5 + pulse * 0.5);
      ctx.beginPath(); ctx.arc(r * 0.12, 0, r * 0.3, 0, U.TAU); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(r * 0.16, 0, r * 0.1, 0, U.TAU); ctx.fill();
      ctx.restore();
    }

    drawOverlay(ctx, time, game) {
      if (this.dead) return;
      const r = this.r;
      const coreColor = this.phase === 1 ? '#ff8a1a' : (this.phase === 2 ? '#ff2d55' : '#ffe0e6');
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.45;
      ctx.drawImage(BO.softSprite(coreColor), this.x - r * 1.6, this.y - r * 1.6, r * 3.2, r * 3.2);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (this.mode === 'transition' || this.mode === 'intro' || this.shieldFlash > 0) {
        ctx.strokeStyle = U.rgba('#7fe3ff', 0.4 + Math.sin(time * 18) * 0.3);
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(this.x, this.y, r + 14 + Math.sin(time * 6) * 3, 0, U.TAU); ctx.stroke();
      }
      if (this.stun > 0) {
        ctx.fillStyle = '#ffd34d';
        for (let i = 0; i < 3; i++) {
          const a = time * 5 + i * U.TAU / 3;
          ctx.beginPath(); ctx.arc(this.x + Math.cos(a) * 30, this.y - r - 12 + Math.sin(a) * 6, 3, 0, U.TAU); ctx.fill();
        }
      }
      const atk = this.attack;
      if (!atk || atk.stage !== 'tele') return;
      const k = U.clamp(atk.t / TELEGRAPH[atk.name], 0, 1);
      ctx.save();
      ctx.lineWidth = 2;
      if (atk.name === 'fan') {
        ctx.strokeStyle = U.rgba('#ff2d55', 0.25 + k * 0.5);
        for (let i = -1; i <= 1; i++) {
          const a = atk.aim + i * 0.57;
          ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x + Math.cos(a) * 420, this.y + Math.sin(a) * 420); ctx.stroke();
        }
      } else if (atk.name === 'stream') {
        ctx.strokeStyle = U.rgba('#ff6b81', 0.3 + k * 0.6);
        ctx.setLineDash([10, 8]);
        ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x + Math.cos(this.angle) * 600, this.y + Math.sin(this.angle) * 600); ctx.stroke();
        ctx.setLineDash([]);
      } else if (atk.name === 'charge') {
        const len = 900;
        ctx.translate(this.x, this.y);
        ctx.rotate(atk.aim);
        ctx.fillStyle = U.rgba('#ff2d55', 0.12);
        ctx.fillRect(0, -r, len, r * 2);
        ctx.fillStyle = U.rgba('#ff2d55', 0.3);
        ctx.fillRect(0, -r, len * k, r * 2);
        ctx.strokeStyle = U.rgba('#ff2d55', 0.8);
        ctx.strokeRect(0, -r, len, r * 2);
      } else if (atk.name === 'nova') {
        ctx.strokeStyle = U.rgba('#ffe0e6', 0.4 + k * 0.5);
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(this.x, this.y, r + 160 * (1 - k), 0, U.TAU); ctx.stroke();
      } else if (atk.name === 'summon' || atk.name === 'mortar') {
        ctx.strokeStyle = U.rgba(atk.name === 'summon' ? '#ffd34d' : '#ff3355', 0.3 + k * 0.6);
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(this.x, this.y, r + 10 + k * 40, 0, U.TAU); ctx.stroke();
      }
      ctx.restore();
    }
  }

  BO.Boss = Boss;
})(window.BO);

  <script>
/* =========================================================================
 * BLACKOUT :: hazards.js
 * Environmental hazards and telegraphed area attacks:
 *  - panel  : electrified floor plates that cycle idle -> warning -> live
 *  - strike : boss mortar circles that fill up, then detonate
 *  - field  : temporary electrified zones spawned in the boss arena
 * ========================================================================= */
'use strict';
(function (BO) {
  const U = BO.U;
  const TICK = 0.25;
  const PANEL_CYCLE = { idle: 3.2, warn: 1.0, live: 1.9 };

  class HazardSystem {
    constructor() { this.zones = []; this.time = 0; }

    clear() { this.zones.length = 0; }

    addPanel(x, y, w, h, offset) {
      this.zones.push({ kind: 'panel', x, y, w, h, t: offset || 0, dps: 26, tick: 0, phase: 'idle' });
    }

    addStrike(x, y, r, warn, damage) {
      this.zones.push({ kind: 'strike', x, y, r, warn, t: 0, damage, done: false });
    }

    addField(x, y, w, h, warn, live, dps) {
      this.zones.push({ kind: 'field', x, y, w, h, warn, live, t: 0, dps, tick: 0, phase: 'warn', done: false });
    }

    clearTemporary() { this.zones = this.zones.filter(z => z.kind === 'panel'); }

    update(dt, game) {
      this.time += dt;
      for (let i = this.zones.length - 1; i >= 0; i--) {
        const z = this.zones[i];
        z.t += dt;
        if (z.kind === 'panel') this._updatePanel(z, dt, game);
        else if (z.kind === 'strike') this._updateStrike(z, game);
        else this._updateField(z, dt, game);
        if (z.done) this.zones.splice(i, 1);
      }
    }

    _updatePanel(z, dt, game) {
      const total = PANEL_CYCLE.idle + PANEL_CYCLE.warn + PANEL_CYCLE.live;
      const c = z.t % total;
      const prev = z.phase;
      z.phase = c < PANEL_CYCLE.idle ? 'idle' : (c < PANEL_CYCLE.idle + PANEL_CYCLE.warn ? 'warn' : 'live');
      if (z.phase === 'live') {
        if (prev !== 'live') game.audio.beep(140, 0.04);
        this._damageRect(z, dt, game, true);
        if (Math.random() < dt * 14) game.particles.sparks(z.x + Math.random() * z.w, z.y + Math.random() * z.h, -Math.PI / 2, 2, '#7fe3ff', 220);
      }
    }

    _updateStrike(z, game) {
      if (z.t >= z.warn && !z.done) {
        z.done = true;
        game.hazardBlast(z.x, z.y, z.r, z.damage);
      }
    }

    _updateField(z, dt, game) {
      if (z.t < z.warn) { z.phase = 'warn'; return; }
      if (z.t < z.warn + z.live) {
        z.phase = 'live';
        this._damageRect(z, dt, game, false);
        if (Math.random() < dt * 18) game.particles.sparks(z.x + Math.random() * z.w, z.y + Math.random() * z.h, -Math.PI / 2, 2, '#ff6b81', 240);
        return;
      }
      z.done = true;
    }

    _damageRect(z, dt, game, hurtsEnemies) {
      z.tick -= dt;
      if (z.tick > 0) return;
      z.tick = TICK;
      const amount = z.dps * TICK;
      const p = game.player;
      if (p && !p.dead && p.x > z.x && p.x < z.x + z.w && p.y > z.y && p.y < z.y + z.h) p.takeDamage(amount, z.x + z.w / 2, z.y + z.h / 2, game);
      if (!hurtsEnemies) return;
      const list = game.enemies;
      for (let i = 0; i < list.length; i++) {
        const e = list[i];
        if (e.dead || e.isBoss) continue;
        if (e.x > z.x && e.x < z.x + z.w && e.y > z.y && e.y < z.y + z.h) game.damageEnemy(e, amount, 0, 0, { source: 'hazard', x: e.x, y: e.y });
      }
    }

    /** Ground layer (below actors). */
    render(ctx, time) {
      for (let i = 0; i < this.zones.length; i++) {
        const z = this.zones[i];
        if (z.kind !== 'panel') continue;
        ctx.fillStyle = '#10141c';
        ctx.fillRect(z.x, z.y, z.w, z.h);
        ctx.strokeStyle = '#2a3446';
        ctx.lineWidth = 1;
        for (let gx = z.x + 8; gx < z.x + z.w; gx += 12) { ctx.beginPath(); ctx.moveTo(gx, z.y + 3); ctx.lineTo(gx, z.y + z.h - 3); ctx.stroke(); }
      }
    }

    /** Above the darkness so telegraphs are always readable. */
    renderOverlay(ctx, time) {
      for (let i = 0; i < this.zones.length; i++) {
        const z = this.zones[i];
        if (z.kind === 'strike') {
          const k = U.clamp(z.t / z.warn, 0, 1);
          ctx.fillStyle = U.rgba('#ff3355', 0.12 + k * 0.18);
          ctx.beginPath(); ctx.arc(z.x, z.y, z.r * k, 0, U.TAU); ctx.fill();
          ctx.strokeStyle = U.rgba('#ff3355', 0.55 + Math.sin(time * 20) * 0.25);
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, U.TAU); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(z.x - 8, z.y); ctx.lineTo(z.x + 8, z.y); ctx.moveTo(z.x, z.y - 8); ctx.lineTo(z.x, z.y + 8); ctx.stroke();
          continue;
        }
        const color = z.kind === 'panel' ? '#7fe3ff' : '#ff6b81';
        if (z.phase === 'warn') {
          const blink = Math.floor(time * 10) % 2 === 0;
          ctx.strokeStyle = U.rgba(color, blink ? 0.9 : 0.35);
          ctx.lineWidth = 2;
          ctx.setLineDash([8, 6]);
          ctx.strokeRect(z.x + 2, z.y + 2, z.w - 4, z.h - 4);
          ctx.setLineDash([]);
          ctx.fillStyle = U.rgba(color, 0.08);
          ctx.fillRect(z.x, z.y, z.w, z.h);
        } else if (z.phase === 'live') {
          ctx.globalCompositeOperation = 'lighter';
          ctx.fillStyle = U.rgba(color, 0.2 + Math.random() * 0.1);
          ctx.fillRect(z.x, z.y, z.w, z.h);
          ctx.strokeStyle = U.rgba(color, 0.9);
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          for (let k = 0; k < 3; k++) {
            let x = z.x + Math.random() * z.w, y = z.y;
            ctx.moveTo(x, y);
            while (y < z.y + z.h) { y += 10; x = U.clamp(x + U.randSpread() * 14, z.x, z.x + z.w); ctx.lineTo(x, y); }
          }
          ctx.stroke();
          ctx.globalCompositeOperation = 'source-over';
        }
      }
    }
  }

  BO.HazardSystem = HazardSystem;
})(window.BO);

/* =========================================================================
 * BLACKOUT :: pickups.js
 * Health, armor, ammo, credits, weapons, power-ups and objective intel.
 * ========================================================================= */
'use strict';
(function (BO) {
  const U = BO.U;
  const COLLECT_RADIUS = 26;
  const MAGNET_RADIUS = 110;
  const DROP_LIFETIME = 40;

  const PICKUP_TYPES = {
    health:  { color: '#3ddc84', value: 35 },
    armor:   { color: '#19c3dd', value: 40 },
    ammo:    { color: '#f0be3d', value: 0.35 },
    credits: { color: '#ffd34d', value: 20 },
    weapon:  { color: '#ff8a1a' },
    damage:  { color: '#ff6a3d', power: true },
    rate:    { color: '#ffd34d', power: true },
    speed:   { color: '#7cff6b', power: true },
    invuln:  { color: '#19c3dd', power: true },
    intel:   { color: '#19c3dd', objective: true }
  };
  const POWER_TYPES = ['damage', 'rate', 'speed', 'invuln'];

  class PickupSystem {
    constructor() { this.items = []; }

    clear() { this.items.length = 0; }

    spawn(type, x, y, opts) {
      const def = PICKUP_TYPES[type];
      if (!def) return null;
      const item = {
        type, x, y, def,
        value: opts && opts.value !== undefined ? opts.value : def.value,
        weaponId: opts && opts.weaponId,
        bob: Math.random() * U.TAU,
        life: opts && opts.permanent ? Infinity : DROP_LIFETIME,
        vx: opts && opts.toss ? U.randSpread() * 140 : 0,
        vy: opts && opts.toss ? U.randSpread() * 140 : 0,
        collected: false,
        delay: opts && opts.toss ? 0.35 : 0
      };
      this.items.push(item);
      return item;
    }

    /** Randomised loot roll used by enemies and destructible props. */
    rollDrop(x, y, chance, generous) {
      if (!U.chance(chance)) return;
      const r = Math.random();
      let type;
      if (r < 0.06 || (generous && r < 0.12)) type = U.pick(POWER_TYPES);
      else if (r < 0.4) type = 'ammo';
      else if (r < 0.62) type = 'health';
      else if (r < 0.78) type = 'armor';
      else type = 'credits';
      this.spawn(type, x, y, { toss: true, value: type === 'credits' ? U.randInt(12, 30) : undefined });
    }

    nearestWeapon(x, y, range) {
      let best = null, bestD = range * range;
      for (let i = 0; i < this.items.length; i++) {
        const it = this.items[i];
        if (it.type !== 'weapon' || it.collected) continue;
        const d = U.dist2(x, y, it.x, it.y);
        if (d < bestD) { bestD = d; best = it; }
      }
      return best;
    }

    update(dt, game) {
      const p = game.player;
      for (let i = this.items.length - 1; i >= 0; i--) {
        const it = this.items[i];
        it.bob += dt * 3;
        it.life -= dt;
        it.delay = Math.max(0, it.delay - dt);
        if (it.vx || it.vy) {
          BO.Collision.moveCircle(game.map, it, it.vx * dt, it.vy * dt, 8);
          it.vx *= Math.max(0, 1 - 5 * dt); it.vy *= Math.max(0, 1 - 5 * dt);
          if (Math.abs(it.vx) + Math.abs(it.vy) < 2) { it.vx = 0; it.vy = 0; }
        }
        if (it.life <= 0 || it.collected) { this.items.splice(i, 1); continue; }
        if (!p || p.dead || it.delay > 0) continue;
        const d2 = U.dist2(p.x, p.y, it.x, it.y);
        if (it.type === 'credits' && d2 < MAGNET_RADIUS * MAGNET_RADIUS) {
          const d = Math.sqrt(d2) || 1;
          it.x += (p.x - it.x) / d * 420 * dt;
          it.y += (p.y - it.y) / d * 420 * dt;
        }
        if (d2 < COLLECT_RADIUS * COLLECT_RADIUS && this._tryCollect(it, game)) {
          it.collected = true;
          this.items.splice(i, 1);
        }
      }
    }

    _tryCollect(it, game) {
      const p = game.player;
      switch (it.type) {
        case 'health': {
          if (p.hp >= p.maxHp) return false;
          const n = Math.round(p.heal(it.value));
          game.onPickup(it, BO.t('pick.health', { n }));
          return true;
        }
        case 'armor': {
          if (p.armor >= p.maxArmor) return false;
          const n = Math.round(p.addArmor(it.value));
          game.onPickup(it, BO.t('pick.armor', { n }));
          return true;
        }
        case 'ammo':
          if (!p.addAmmoAll(it.value)) return false;
          game.onPickup(it, BO.t('pick.ammo'));
          return true;
        case 'credits':
          game.addCredits(it.value);
          game.onPickup(it, BO.t('pick.credits', { n: it.value }));
          return true;
        case 'weapon': {
          const res = p.giveWeapon(it.weaponId);
          if (res === -1) return false; // full inventory: needs [E] to swap
          game.onPickup(it, BO.t('pick.weapon', { name: BO.t('w.' + it.weaponId) }));
          return true;
        }
        case 'intel':
          game.onPickup(it, BO.t('pick.intel'));
          game.objectives.notify('collect');
          return true;
        default:
          if (it.def.power) {
            p.activatePowerup(it.type);
            game.onPickup(it, BO.t('pick.' + it.type));
            return true;
          }
          return false;
      }
    }

    render(ctx, time, rect) {

/* =========================================================================
 * BLACKOUT :: objectives.js
 * Sequential mission objectives that update dynamically, plus the wave
 * director used by "survive" objectives.
 * ========================================================================= */
'use strict';
(function (BO) {
  const U = BO.U;
  const CFG = BO.CONFIG;

  const LABELS = {
    eliminate: 'obj.eliminate', destroy: 'obj.destroy', collect: 'obj.collect', activate: 'obj.activate',
    survive: 'obj.survive', boss: 'obj.boss', extract: 'obj.extract'
  };

  class ObjectiveSystem {
    constructor(game, defs) {
      this.game = game;
      this.stages = (defs || []).map(d => Object.assign({ progress: 0, total: 1, done: false, timeLeft: 0, extractTime: 0 }, d));
      this.index = -1;
      this.finished = false;
    }

    get current() { return this.stages[this.index] || null; }

    start() { this._next(); }

    _next() {
      this.index++;
      const s = this.current;
      if (!s) { this.finished = true; this.game.onAllObjectivesComplete(); return; }
      U.safe('objective.begin', () => this._begin(s));
      this.game.onObjectiveStarted(s, this.index);
      const autoDone = ((s.type === 'eliminate' || s.type === 'destroy') && s.total <= 0) ||
        (s.type !== 'survive' && s.type !== 'extract' && s.progress >= s.total);
      if (autoDone) this._complete(s);
    }

    _begin(s) {
      const g = this.game;
      switch (s.type) {
        case 'eliminate': s.total = g.enemies.filter(e => !e.dead && !e.isBoss && !e.isWave && !e.minion).length; break;
        case 'destroy': s.total = g.targets.filter(t => t.kind === s.target && !t.dead).length; break;
        case 'collect': s.total = s.count; break;
        case 'activate': s.total = s.count; break;
        case 'survive': s.timeLeft = s.duration; s.total = s.duration; g.waves.start(s); break;
        case 'boss': s.total = 1; g.unlockBossArena(); break;
        case 'extract': s.total = 1; g.openExtraction(); break;
        default: s.total = 1; s.progress = 1; // unknown objective type: auto-complete instead of soft-locking
      }
    }

    _complete(s) {
      if (s.done) return;
      s.done = true;
      this.game.onObjectiveComplete(s);
      this._next();
    }

    /** Gameplay events feed progress into the active objective only. */
    notify(event, data) {
      const s = this.current;
      if (!s || s.done) return;
      let match = false;
      if (event === 'kill' && s.type === 'eliminate' && data && !data.isWave && !data.minion && !data.isBoss) match = true;
      else if (event === 'destroy' && s.type === 'destroy' && data === s.target) match = true;
      else if (event === 'collect' && s.type === 'collect') match = true;
      else if (event === 'activate' && s.type === 'activate') match = true;
      else if (event === 'bossDead' && s.type === 'boss') match = true;
      if (!match) return;
      s.progress = Math.min(s.total, s.progress + 1);
      this.game.onObjectiveProgress(s);
      if (s.progress >= s.total) this._complete(s);
    }

    update(dt) {
      const s = this.current;
      if (!s || s.done) return;
      if (s.type === 'survive') {
        s.timeLeft -= dt;
        s.progress = s.duration - Math.max(0, s.timeLeft);
        if (s.timeLeft <= 0) { this.game.waves.stop(); this._complete(s); }
      } else if (s.type === 'extract') {
        const g = this.game, p = g.player, ex = g.level.extraction;
        const inside = p && !p.dead && U.dist(p.x, p.y, ex.x, ex.y) < CFG.EXTRACTION_RADIUS;
        s.extractTime = inside ? s.extractTime + dt : Math.max(0, s.extractTime - dt * 2);
        if (s.extractTime >= CFG.EXTRACTION_TIME) this._complete(s);
      }
    }

    label(s) {
      const stage = s || this.current;
      if (!stage) return '';
      let text = BO.t(stage.type === 'destroy' && stage.target === 'core' ? 'obj.destroyCore' : LABELS[stage.type] || 'obj.extract');
      const I = BO.I18N;
      if (stage.type === 'eliminate' || stage.type === 'destroy' || stage.type === 'collect' || stage.type === 'activate') {
        text += '  ' + I.num(stage.progress) + '/' + I.num(stage.total);
      } else if (stage.type === 'survive') {
        text += '  ' + I.num(U.formatTime(Math.max(0, stage.timeLeft)));
      }
      return text;
    }

    /** World positions the HUD should point at for the current objective. */
    markers(out) {
      out.length = 0;
      const s = this.current, g = this.game;
      if (!s) return out;
      switch (s.type) {
        case 'destroy': g.targets.forEach(t => { if (t.kind === s.target && !t.dead) out.push(t); }); break;
        case 'collect': g.pickups.items.forEach(it => { if (it.type === 'intel') out.push(it); }); break;
        case 'activate': g.terminals.forEach(t => { if (!t.activated) out.push(t); }); break;
        case 'boss': if (g.boss && !g.boss.dead) out.push(g.boss); else if (g.level.arenaCenter) out.push(g.level.arenaCenter); break;
        case 'extract': out.push(g.level.extraction); break;
        case 'survive': if (g.level.uplink) out.push(g.level.uplink); break;
        case 'eliminate': {
          const alive = g.enemies.filter(e => !e.dead && !e.isBoss && !e.isWave);
          if (alive.length <= 4) alive.forEach(e => out.push(e));
          break;
        }
        default: break;
      }
      return out;
    }
  }

  /** Spawns timed waves of hostiles out of the player's sight during "survive". */
  class WaveDirector {
    constructor(game) {
      this.game = game;
      this.active = false;
      this.timer = 0;
      this.wave = 0;
      this.stage = null;
    }

    start(stage) {
      this.active = true;
      this.stage = stage;
      this.timer = 2;
      this.wave = 0;
    }

    stop() { this.active = false; }

    update(dt) {
      if (!this.active) return;
      this.timer -= dt;
      if (this.timer > 0) return;
      const g = this.game;
      const alive = g.enemies.filter(e => !e.dead && e.isWave).length;
      this.timer = this.stage.interval || 11;
      if (alive >= (this.stage.maxAlive || 9)) return;
      this.wave++;
      const size = Math.min((this.stage.waveSize || 3) + Math.floor(this.wave / 2), 6);
      const types = this.stage.types || ['grunt', 'rusher'];
      let spawned = 0;
      for (let i = 0; i < size; i++) {
        const pt = this._spawnPoint();
        if (!pt) continue;
        const e = g.spawnEnemy(U.pick(types), pt.x, pt.y, { wave: true });
        if (e) spawned++;
      }
      if (spawned) g.notify(BO.t('note.waveIncoming'), '#ff3355');
    }

    _spawnPoint() {
      const g = this.game, p = g.player;
      const pts = g.level.spawnPoints;
      for (let tries = 0; tries < 20; tries++) {
        const pt = U.pick(pts);
        if (!pt) return null;
        const d = U.dist(pt.x, pt.y, p.x, p.y);
        if (d < 520 || d > 1800) continue;
        if (BO.Collision.lineOfSight(g.map, pt.x, pt.y, p.x, p.y, BO.COLLIDE.SIGHT)) continue;
        if (!g.map.isCircleFree(pt.x, pt.y, 16)) continue;
        return pt;
      }
      return null;
    }
  }

  BO.ObjectiveSystem = ObjectiveSystem;
  BO.WaveDirector = WaveDirector;
})(window.BO);

/* =========================================================================
 * BLACKOUT :: level.js  (LevelManager)
 * Seeded procedural facility generator: rooms + corridors (MST with extra
 * loops), doors, cover clusters, destructibles, lighting, hazards, objective
 * entities, enemy squads and loot. A boss arena is sealed behind one locked
 * door. Connectivity is verified with a flood fill.
 * ========================================================================= */

(function (BO) {
  const U = BO.U;
  const TILE = BO.CONFIG.TILE;
  const T = BO.TILE_TYPE;

  const PROP_DEFS = {
    crate:    { hp: 60,  destructible: true,  tall: false, color: '#5a4630', debris: '#7a5c3a', drop: 0.45 },
    barrier:  { hp: 0,   destructible: false, tall: false, color: '#4a4e5a' },
    barrel:   { hp: 28,  destructible: true,  tall: false, color: '#b8352a', debris: '#5a1d18', explosive: 125, blastDamage: 85 },
    computer: { hp: 40,  destructible: true,  tall: false, color: '#20262f', debris: '#3a4250', drop: 0.25 },
    pillar:   { hp: 0,   destructible: false, tall: true,  color: '#2a2e38' },
    locker:   { hp: 0,   destructible: false, tall: true,  color: '#343a46' },
    cache:    { hp: 260, destructible: true,  tall: false, color: '#3d4a2c', debris: '#5c6b3d', objective: 'cache', explosive: 110, blastDamage: 40, drop: 1 },
    core:     { hp: 650, destructible: true,  tall: true,  color: '#3a1e2a', debris: '#ff2d55', objective: 'core', explosive: 150, blastDamage: 50, drop: 1 },
    terminal: { hp: 0,   destructible: false, tall: false, color: '#1b2430', interact: true }
