  <style>
/* =========================================================================
 * BLACKOUT :: style.css
 * Palette: emergency-blaze orange leads (the one colour you can always find
 * in the dark), hostile crimson, tech cyan, ink tinted toward indigo.
 * ========================================================================= */
:root {
  --ink: #07080d;
  --ink-2: #0d0f18;
  --ink-3: #151826;
  --line: rgba(238, 240, 246, 0.08);
  --text: #eef0f6;
  --muted: #9aa0b4;
  --blaze: #ff8a1a;
  --blaze-dim: rgba(255, 138, 26, 0.16);
  --hostile: #ff3355;
  --tech: #19c3dd;
  --ok: #3ddc84;
  --display: 'Khand', 'Chakra Petch', sans-serif;
  --ui: 'Chakra Petch', 'Khand', sans-serif;
  --fa: 'Vazirmatn', Tahoma, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--text); }
body { font-family: var(--ui); font-size: 16px; -webkit-font-smoothing: antialiased; user-select: none; }
html[lang="fa"] body { font-family: var(--fa); }
html[lang="fa"] .title-fa, html[lang="fa"] h2, html[lang="fa"] h3, html[lang="fa"] .nav { font-family: var(--fa); }

#game { position: fixed; inset: 0; display: block; cursor: crosshair; }
#ui { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s var(--ease); }
body.ready #ui { opacity: 1; }
#ui.in-game #game { cursor: none; }
body:has(#ui.in-game) #game { cursor: none; }

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
button:focus-visible { outline: 2px solid var(--blaze); outline-offset: 2px; }

/* ------------------------------- Screens ------------------------------- */
.screen {
  position: absolute; inset: 0; display: flex; pointer-events: none;
  opacity: 0; visibility: hidden; transform: translateY(10px);
  transition: opacity .35s var(--ease), transform .45s var(--ease), visibility 0s linear .35s;
}
.screen.active { opacity: 1; visibility: visible; transform: none; pointer-events: auto; transition-delay: 0s; }
.screen.dim { background: rgba(5, 6, 12, 0.72); backdrop-filter: blur(3px); }
.screen.dim.red { background: radial-gradient(ellipse at center, rgba(60, 6, 16, 0.75), rgba(5, 6, 12, 0.92)); }

/* -------------------------------- Menu --------------------------------- */
[data-screen="menu"] { align-items: stretch; }
.menu-col {
  width: min(640px, 94vw); padding: 7vh 56px 40px; display: flex; flex-direction: column;
}
.title-block { margin-bottom: 5vh; }
.title {
  font-family: var(--display); font-weight: 700; font-size: clamp(64px, 8vw, 116px); line-height: .82;
  letter-spacing: .02em; margin: 0; color: var(--text); direction: ltr; text-align: start;
}
html[dir="rtl"] .title { text-align: right; }
.title .flicker { color: var(--blaze); text-shadow: 0 0 28px rgba(255, 138, 26, .55); animation: flicker 6s infinite steps(1); }
@keyframes flicker {
  0%, 17%, 19%, 52%, 54%, 100% { opacity: 1; }
  18%, 53% { opacity: .15; text-shadow: none; }
  53.5% { opacity: .6; }
}
.title-fa { font-family: var(--fa); font-weight: 800; font-size: 34px; color: var(--blaze); margin-top: 6px; letter-spacing: 0; }
.subtitle { font-size: 14px; letter-spacing: .28em; color: var(--muted); margin-top: 14px; }
html[lang="fa"] .subtitle { letter-spacing: 0; font-size: 15px; }

.menu-nav { display: flex; flex-direction: column; gap: 2px; }
.nav {
  position: relative; text-align: start; padding: 10px 18px; font-family: var(--display); font-weight: 600;
  font-size: 28px; letter-spacing: .06em; color: #c9ccd8; transition: color .2s var(--ease), transform .25s var(--ease);
  overflow: hidden;
}
html[lang="fa"] .nav { font-size: 22px; letter-spacing: 0; font-weight: 700; padding: 8px 18px; }
.nav::before {
  content: ''; position: absolute; inset-block: 8px; inset-inline-start: 0; width: 4px; background: var(--blaze);
  transform: scaleY(0); transition: transform .25s var(--ease);
}
.nav::after {
  content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, var(--blaze-dim), transparent 70%);
  opacity: 0; transition: opacity .25s var(--ease); z-index: -1;
}
html[dir="rtl"] .nav::after { background: linear-gradient(270deg, var(--blaze-dim), transparent 70%); }
.nav:hover, .nav:focus-visible { color: var(--text); transform: translateX(8px); }
html[dir="rtl"] .nav:hover, html[dir="rtl"] .nav:focus-visible { transform: translateX(-8px); }
.nav:hover::before, .nav:focus-visible::before { transform: scaleY(1); }
.nav:hover::after { opacity: 1; }
.nav.primary-nav { color: var(--blaze); font-size: 40px; }
html[lang="fa"] .nav.primary-nav { font-size: 30px; }
.menu-nav.compact .nav { font-size: 24px; text-align: center; }
.menu-nav.compact .nav.primary-nav { font-size: 32px; }

.next-op { margin-top: auto; padding-top: 24px; font-size: 14px; color: var(--muted); letter-spacing: .08em; }
.profile { display: flex; gap: 24px; align-items: flex-end; margin-top: 14px; padding-top: 16px; border-top: 1px solid var(--line); }
.profile span { display: block; font-size: 14px; color: var(--muted); letter-spacing: .1em; }
.profile b { font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1; }
html[lang="fa"] .profile b { font-family: var(--fa); font-size: 24px; }
.p-credits b { color: #ffd34d; }
.p-xp { flex: 1; }
.p-xp-label { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
.p-xp-label span { display: inline; }
.xpbar { height: 4px; background: rgba(255, 255, 255, .08); margin-top: 8px; }
.xpbar i { display: block; height: 100%; background: var(--tech); width: 0; transition: width .8s var(--ease); }

.lang-switch { position: absolute; top: 24px; inset-inline-end: 28px; display: flex; gap: 4px; z-index: 2; }
.lang-switch button, .seg button {
  padding: 6px 14px; font-size: 14px; border: 1px solid var(--line); color: var(--muted); transition: all .2s var(--ease);
}
.lang-switch button[data-value="fa"], .seg button[data-value="fa"] { font-family: var(--fa); }
.lang-switch button.on, .seg button.on { color: var(--ink); background: var(--blaze); border-color: var(--blaze); }
.lang-switch button:hover:not(.on), .seg button:hover:not(.on) { color: var(--text); border-color: rgba(255, 138, 26, .5); }

/* ------------------------------- Panels -------------------------------- */
.panel-screen { align-items: center; justify-content: center; background: rgba(5, 6, 12, .55); }
.panel {
  width: min(760px, 94vw); max-height: 90vh; display: flex; flex-direction: column;
  background: linear-gradient(180deg, rgba(16, 18, 30, .96), rgba(10, 11, 20, .96));
  border-top: 3px solid var(--blaze); box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
}
.panel.wide { width: min(1080px, 95vw); }
.panel.narrow { width: min(560px, 94vw); }
.panel-head { display: flex; align-items: baseline; gap: 20px; padding: 26px 32px 14px; }
.panel-head h2 { margin: 0; font-family: var(--display); font-size: 44px; font-weight: 700; letter-spacing: .04em; line-height: 1; }
html[lang="fa"] .panel-head h2 { font-size: 34px; }
.head-mission { color: var(--blaze); font-size: 16px; letter-spacing: .1em; }
.head-credits { margin-inline-start: auto; color: var(--muted); font-size: 14px; }
.head-credits b { color: #ffd34d; font-size: 22px; font-family: var(--display); }
html[lang="fa"] .head-credits b { font-family: var(--fa); }
.panel-foot { display: flex; justify-content: space-between; gap: 12px; padding: 18px 32px 26px; border-top: 1px solid var(--line); }

.btn {
  padding: 12px 26px; font-size: 16px; font-weight: 600; letter-spacing: .1em; border: 1px solid rgba(238, 240, 246, .18);
  transition: all .2s var(--ease);
}
html[lang="fa"] .btn { letter-spacing: 0; }
.btn:hover:not(:disabled) { border-color: var(--blaze); color: var(--blaze); }
.btn.primary { background: var(--blaze); color: #160b02; border-color: var(--blaze); }
.btn.primary:hover:not(:disabled) { background: #ffa142; color: #160b02; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(255, 138, 26, .3); }
.btn.big { padding: 14px 40px; font-size: 18px; }
.btn.danger { border-color: rgba(255, 51, 85, .5); color: var(--hostile); }
.btn.danger:hover { background: var(--hostile); color: #fff; }
[hidden] { display: none !important; }

/* ------------------------------ Missions ------------------------------- */
.mission-list { overflow: auto; padding: 4px 32px 18px; display: flex; flex-direction: column; gap: 8px; }
.card { text-align: start; transition: background .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease); }
.mission {
  display: grid; grid-template-columns: 70px 1fr 170px; gap: 18px; align-items: center; padding: 16px 18px;
  background: rgba(255, 255, 255, .025); border: 1px solid var(--line); border-inline-start: 3px solid transparent;
}
.mission:hover { background: rgba(255, 138, 26, .07); border-inline-start-color: var(--blaze); }
.mission.locked { opacity: .45; }
.mission.locked:hover { background: rgba(255, 255, 255, .025); border-inline-start-color: transparent; }
.m-index { font-family: var(--display); font-size: 46px; font-weight: 700; color: var(--blaze); line-height: 1; }
html[lang="fa"] .m-index { font-family: var(--fa); font-size: 36px; }
.m-body { display: flex; flex-direction: column; gap: 4px; }
.m-name { font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: .04em; line-height: 1.1; }
html[lang="fa"] .m-name { font-family: var(--fa); font-size: 20px; }
.m-desc { color: var(--muted); font-size: 15px; line-height: 1.5; }
.m-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 14px; color: var(--muted); }
.m-diff { font-weight: 700; letter-spacing: .12em; }
.m-diff[data-diff="easy"] { color: var(--ok); }
.m-diff[data-diff="medium"] { color: #ffd34d; }
.m-diff[data-diff="hard"] { color: var(--blaze); }
.m-diff[data-diff="extreme"] { color: var(--hostile); }
.mission.done .m-best { color: var(--ok); }

/* ------------------------------- Loadout ------------------------------- */
.tabs { display: flex; gap: 4px; padding: 0 32px 14px; }
.tab { padding: 8px 18px; font-size: 15px; letter-spacing: .12em; color: var(--muted); border-bottom: 2px solid transparent; }
.tab.on { color: var(--text); border-bottom-color: var(--blaze); }
.loadout-body { display: grid; grid-template-columns: 1fr 360px; gap: 24px; padding: 0 32px 18px; min-height: 0; overflow: auto; }
.weapon-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; align-content: start; }
.weapon { display: flex; flex-direction: column; gap: 6px; padding: 12px; background: rgba(255, 255, 255, .025); border: 1px solid var(--line); position: relative; }
.weapon canvas { width: 120px; height: 44px; }
.weapon:hover { border-color: rgba(255, 138, 26, .5); }
.weapon.selected { border-color: var(--blaze); background: rgba(255, 138, 26, .08); }
.weapon.locked .w-name { color: var(--muted); }
.w-name { font-weight: 600; font-size: 15px; }
.w-tag { font-size: 14px; color: #ffd34d; min-height: 1em; }
.weapon.equipped .w-tag { color: var(--blaze); }
.weapon-detail { background: rgba(0, 0, 0, .25); padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.weapon-detail canvas { width: 100%; height: auto; }
.weapon-detail h3 { margin: 0; font-family: var(--display); font-size: 30px; font-weight: 700; letter-spacing: .04em; }

.stats { display: flex; flex-direction: column; gap: 8px; margin: 6px 0 8px; }
.stat { display: grid; grid-template-columns: 110px 1fr 70px; gap: 10px; align-items: center; font-size: 14px; }
.s-label { color: var(--muted); letter-spacing: .06em; }
.s-bar { height: 6px; background: rgba(255, 255, 255, .08); }
.s-bar i { display: block; height: 100%; background: var(--blaze); transition: width .4s var(--ease); }
.s-val { text-align: end; font-weight: 600; direction: ltr; }
html[dir="rtl"] .s-val { text-align: left; }

/* ------------------------------- Upgrades ------------------------------ */
.upgrade-list { overflow: auto; padding: 0 32px 18px; display: flex; flex-direction: column; gap: 6px; }
.upgrade { display: grid; grid-template-columns: 1fr auto 190px; gap: 18px; align-items: center; padding: 14px 16px; background: rgba(255, 255, 255, .025); border: 1px solid var(--line); }
.u-body { display: flex; flex-direction: column; gap: 3px; }
.u-name { font-weight: 700; font-size: 17px; letter-spacing: .05em; }
.u-desc { font-size: 14px; color: var(--muted); }

.u-pips i { width: 18px; height: 6px; background: rgba(255, 255, 255, .1); }
.u-pips i.on { background: var(--tech); box-shadow: 0 0 8px rgba(25, 195, 221, .5); }
.u-buy { padding: 10px 14px; font-size: 14px; font-weight: 700; border: 1px solid var(--blaze); color: var(--blaze); transition: all .2s var(--ease); }
.u-buy:hover:not(:disabled) { background: var(--blaze); color: #160b02; }
.upgrade.maxed .u-buy { border-color: var(--tech); color: var(--tech); opacity: 1; }

/* ------------------------------- Settings ------------------------------ */
.settings { padding: 4px 32px 18px; display: flex; flex-direction: column; gap: 4px; overflow: auto; }
.settings .row { display: grid; grid-template-columns: 220px 1fr 70px; align-items: center; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.settings .row > span { color: #c9ccd8; letter-spacing: .06em; }
.settings .row .toggle, .settings .row .seg { grid-column: 2 / 4; justify-self: start; }
.settings .row.danger { border: 0; padding-top: 18px; grid-template-columns: 1fr; }
.settings output { text-align: end; color: var(--blaze); font-weight: 600; }
.seg { display: flex; gap: 4px; }
.toggle { min-width: 86px; padding: 6px 14px; border: 1px solid var(--line); color: var(--muted); font-weight: 700; }
.toggle.on { background: var(--blaze); color: #160b02; border-color: var(--blaze); }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; background: rgba(255, 255, 255, .12); outline: none; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--blaze); border: 0; cursor: pointer; }
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; background: var(--blaze); border: 0; cursor: pointer; border-radius: 0; }

.credits-body { padding: 4px 32px 20px; color: #c9ccd8; line-height: 1.7; font-size: 16px; }

.credits-body p:first-child { font-family: var(--display); font-size: 28px; color: var(--blaze); font-weight: 700; }

/* ---------------------------- Center screens --------------------------- */
.center-screen { flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; }

.kia-sub { color: var(--muted); margin: 0; }

.res-mission { color: var(--blaze); letter-spacing: .18em; font-size: 15px; }
.rating { display: flex; flex-direction: column; align-items: center; }

/* =========================================================================
 * BLACKOUT :: utils.js
 * Shared math helpers, seeded RNG, object pooling and a tiny event bus.
 * All game modules attach to the single global namespace `BO`.
 * ========================================================================= */
'use strict';
window.BO = window.BO || {};

(function (BO) {
  const TAU = Math.PI * 2;

  const U = {
    TAU,
    clamp(v, min, max) { return v < min ? min : (v > max ? max : v); },
    lerp(a, b, t) { return a + (b - a) * t; },
    invLerp(a, b, v) { return b === a ? 0 : (v - a) / (b - a); },
    rand(min, max) { return min + Math.random() * (max - min); },
    randInt(min, max) { return Math.floor(min + Math.random() * (max - min + 1)); },
    /** Triangular distribution in [-1, 1], cheap pseudo-gaussian spread. */
    randSpread() { return Math.random() + Math.random() - 1; },
    pick(list) { return list[Math.floor(Math.random() * list.length)]; },
    chance(p) { return Math.random() < p; },
    dist(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return Math.sqrt(dx * dx + dy * dy); },
    dist2(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; },
    angleTo(ax, ay, bx, by) { return Math.atan2(by - ay, bx - ax); },
    /** Signed shortest difference from angle a to angle b, in (-PI, PI]. */
    angleDiff(a, b) {
      let d = (b - a) % TAU;
      if (d > Math.PI) d -= TAU;
      if (d < -Math.PI) d += TAU;
      return d;
    },
    /** Rotate angle `from` towards `to` by at most `step` radians. */
    turnTowards(from, to, step) {
      const d = U.angleDiff(from, to);
      if (Math.abs(d) <= step) return to;
      return from + Math.sign(d) * step;
    },
    approach(value, target, step) {
      if (value < target) return Math.min(value + step, target);
      return Math.max(value - step, target);
    },
    /** Frame-rate independent exponential smoothing. */
    damp(current, target, lambda, dt) { return U.lerp(current, target, 1 - Math.exp(-lambda * dt)); },
    easeOutCubic(t) { const k = 1 - t; return 1 - k * k * k; },
    easeInCubic(t) { return t * t * t; },
    easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; },
    easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    isFiniteNumber(v) { return typeof v === 'number' && Number.isFinite(v); },
    formatTime(seconds) {
      const s = Math.max(0, Math.floor(seconds));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return m + ':' + (r < 10 ? '0' : '') + r;
    },
    hexToRgb(hex) {
      const h = hex.replace('#', '');
      const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
      return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
    },
    rgba(hex, alpha) {
      const c = U.hexToRgb(hex);
      return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + alpha + ')';
    },
    /**
     * Segment vs circle intersection.
     * Returns the parametric t in [0,1] of the first contact, or -1.
     */
    segmentCircle(x0, y0, x1, y1, cx, cy, r) {
      const dx = x1 - x0, dy = y1 - y0;
      const fx = x0 - cx, fy = y0 - cy;
      const a = dx * dx + dy * dy;
      if (a < 1e-9) return (fx * fx + fy * fy <= r * r) ? 0 : -1;
      const b = 2 * (fx * dx + fy * dy);
      const c = fx * fx + fy * fy - r * r;
      let disc = b * b - 4 * a * c;
      if (disc < 0) return -1;
      disc = Math.sqrt(disc);
      const t1 = (-b - disc) / (2 * a);
      const t2 = (-b + disc) / (2 * a);
      if (t1 >= 0 && t1 <= 1) return t1;
      if (t1 < 0 && t2 >= 0) return 0; // segment starts inside the circle
      return -1;
    },
    /** Mulberry32 seeded random generator, used for deterministic level layouts. */
    makeRng(seed) {
      let s = seed >>> 0;
      return function rng() {
        s = (s + 0x6D2B79F5) | 0;
        let t = Math.imul(s ^ (s >>> 15), 1 | s);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };

    /** Runs fn and swallows (but reports once per label) any exception. */
    safe(label, fn) {
      try { return fn(); } catch (err) { U.reportError(label, err); return undefined; }
    },
    _reported: Object.create(null),
    reportError(label, err) {
      if (U._reported[label]) return;
      U._reported[label] = true;
      console.warn('[BLACKOUT] recovered from error in ' + label + ':', err);
    }

  /**
   * Fixed-capacity object pool. Objects are created once and recycled, which
   * keeps the hot game loop allocation free.
   */
  class Pool {
    constructor(factory, initialSize, maxSize) {
      this.factory = factory;
      this.maxSize = maxSize || initialSize;
      this.items = [];
      this.free = [];
      this.activeCount = 0;
      for (let i = 0; i < initialSize; i++) this._create();
    }
    _create() {
      const item = this.factory();
      item.active = false;
      this.items.push(item);
      this.free.push(item);
      return item;
    }
    /** Returns an inactive object or null when the pool is exhausted. */
    acquire() {
      if (this.free.length === 0) {
        if (this.items.length >= this.maxSize) return null;

      item.active = true;
      this.activeCount++;

      this.activeCount--;
      this.free.push(item);
    }

      for (let i = 0; i < this.items.length; i++) this.release(this.items[i]);

    setMaxSize(n) { this.maxSize = Math.max(n, 1); }
  }

  class EventBus {
    constructor() { this.handlers = Object.create(null); }
    on(name, fn) { (this.handlers[name] || (this.handlers[name] = [])).push(fn); return fn; }

      const list = this.handlers[name];
      if (!list) return;
      const i = list.indexOf(fn);
      if (i >= 0) list.splice(i, 1);
    }
    emit(name, payload) {
      const list = this.handlers[name];
      if (!list) return;
      for (let i = 0; i < list.length; i++) U.safe('event:' + name, () => list[i](payload));

/* =========================================================================
 * BLACKOUT :: save.js
 * localStorage persistence with strict sanitisation. Any malformed field is
 * replaced by its default so a corrupted save can never crash the game.
 * ========================================================================= */
'use strict';
(function (BO) {
  const SAVE_KEY = 'blackout.save.v1';
  const VERSION = 1;
  const UPGRADE_IDS = ['maxHp', 'armor', 'speed', 'reload', 'damage', 'accuracy', 'magazine'];
  const PARTICLE_LEVELS = ['low', 'medium', 'high'];

  /** In-memory fallback for sandboxed contexts where localStorage throws. */
  const memoryStore = Object.create(null);
  const storage = {
    get(key) {
      try { return window.localStorage.getItem(key); } catch (e) { return memoryStore[key] || null; }
    },
    set(key, value) {
      try { window.localStorage.setItem(key, value); return true; } catch (e) { memoryStore[key] = value; return false; }
    },
    remove(key) {
      try { window.localStorage.removeItem(key); } catch (e) { /* ignore */ }
      delete memoryStore[key];
    }
  };

  function defaultSettings() {
    return {
      master: 0.8, music: 0.55, sfx: 0.85, sensitivity: 1, screenShake: true,
      particles: 'high', fps: false, lang: 'fa'
    };
  }

  function defaults() {
    const upgrades = {};
    UPGRADE_IDS.forEach(id => { upgrades[id] = 0; });
    return {
      version: VERSION, xp: 0, level: 1, credits: 250,
      unlockedWeapons: ['pistol', 'ar', 'smg'],
      upgrades,
      completedMissions: [],
      bestRatings: {},
      loadout: { primary: 'ar', secondary: 'pistol' },
      settings: defaultSettings(),
      stats: { kills: 0, deaths: 0, missions: 0 }
    };
  }

  const num = (v, fallback, min, max) => (BO.U.isFiniteNumber(v) ? BO.U.clamp(v, min, max) : fallback);

  /** Validates every field of an untrusted object against the schema. */
  function sanitize(raw) {
    const d = defaults();
    if (!raw || typeof raw !== 'object') return d;
    const weaponIds = BO.WEAPONS ? Object.keys(BO.WEAPONS) : d.unlockedWeapons;
    const missionIds = BO.MISSIONS ? BO.MISSIONS.map(m => m.id) : [];
    const out = d;
    out.xp = Math.floor(num(raw.xp, 0, 0, 1e9));
    out.level = Math.floor(num(raw.level, 1, 1, 999));
    out.credits = Math.floor(num(raw.credits, d.credits, 0, 1e9));
    if (Array.isArray(raw.unlockedWeapons)) {
      const list = raw.unlockedWeapons.filter(id => typeof id === 'string' && weaponIds.indexOf(id) >= 0);
      d.unlockedWeapons.forEach(id => { if (list.indexOf(id) < 0) list.push(id); });
      out.unlockedWeapons = Array.from(new Set(list));
    }
    if (raw.upgrades && typeof raw.upgrades === 'object') {
      UPGRADE_IDS.forEach(id => { out.upgrades[id] = Math.floor(num(raw.upgrades[id], 0, 0, 5)); });
    }
    if (Array.isArray(raw.completedMissions)) {
      out.completedMissions = Array.from(new Set(raw.completedMissions.filter(id => typeof id === 'string' && (missionIds.length === 0 || missionIds.indexOf(id) >= 0))));
    }
    if (raw.bestRatings && typeof raw.bestRatings === 'object') {
      for (const k in raw.bestRatings) {
        if (typeof raw.bestRatings[k] === 'string' && /^[SABCD]$/.test(raw.bestRatings[k])) out.bestRatings[k] = raw.bestRatings[k];
      }
    }
    if (raw.loadout && typeof raw.loadout === 'object') {
      const p = raw.loadout.primary, s = raw.loadout.secondary;
      if (out.unlockedWeapons.indexOf(p) >= 0) out.loadout.primary = p;
      if (out.unlockedWeapons.indexOf(s) >= 0 && s !== out.loadout.primary) out.loadout.secondary = s;
    }
    if (raw.settings && typeof raw.settings === 'object') {
      const s = raw.settings;
      out.settings.master = num(s.master, out.settings.master, 0, 1);
      out.settings.music = num(s.music, out.settings.music, 0, 1);
      out.settings.sfx = num(s.sfx, out.settings.sfx, 0, 1);
      out.settings.sensitivity = num(s.sensitivity, 1, 0.2, 3);
      out.settings.screenShake = typeof s.screenShake === 'boolean' ? s.screenShake : true;
      out.settings.particles = PARTICLE_LEVELS.indexOf(s.particles) >= 0 ? s.particles : 'high';
      out.settings.fps = typeof s.fps === 'boolean' ? s.fps : false;
      out.settings.lang = (s.lang === 'fa' || s.lang === 'en') ? s.lang : out.settings.lang;
    }
    if (raw.stats && typeof raw.stats === 'object') {
      out.stats.kills = Math.floor(num(raw.stats.kills, 0, 0, 1e9));
      out.stats.deaths = Math.floor(num(raw.stats.deaths, 0, 0, 1e9));
      out.stats.missions = Math.floor(num(raw.stats.missions, 0, 0, 1e9));
    }
    return out;
  }

  const SaveSystem = {
    data: defaults(),
    wasCorrupted: false,
    load() {
      const raw = storage.get(SAVE_KEY);
      if (!raw) { this.data = defaults(); return this.data; }
      try {
        this.data = sanitize(JSON.parse(raw));
      } catch (err) {
        this.wasCorrupted = true;
        storage.set(SAVE_KEY + '.corrupt', raw);
        this.data = defaults();
        this.save();
      }
      return this.data;
    },
    save() {
      try {
        storage.set(SAVE_KEY, JSON.stringify(this.data));
      } catch (err) { BO.U.reportError('save', err); }
    },
    reset() {
      const keepSettings = this.data.settings;
      storage.remove(SAVE_KEY);
      this.data = defaults();
      this.data.settings = keepSettings;
      this.save();
    },
    sanitize,
    defaults
  };

  BO.SaveSystem = SaveSystem;
  BO.UPGRADE_IDS = UPGRADE_IDS;
})(window.BO);

/* =========================================================================
 * BLACKOUT :: audio.js
 * Fully procedural audio using the Web Audio API: synthesized weapon sounds,
 * impacts, UI cues and an adaptive step-sequenced soundtrack
 * (menu / explore / combat / boss).
 * ========================================================================= */
'use strict';
(function (BO) {
  const U = BO.U;
  const MAX_HEAR_DIST = 1500;
  const LOOKAHEAD = 0.12;
  const SCHEDULE_MS = 25;

  /** Per-weapon synthesis recipes. All sounds are noise + pitched body layers. */
  const SHOT_PROFILES = {
    pistol:   { noiseDur: 0.12, cut0: 3400, cut1: 700,  body0: 170, body1: 55, bodyDur: 0.1,  vol: 0.5 },
    revolver: { noiseDur: 0.26, cut0: 2600, cut1: 400,  body0: 120, body1: 38, bodyDur: 0.2,  vol: 0.72 },
    smg:      { noiseDur: 0.07, cut0: 3000, cut1: 1200, body0: 210, body1: 90, bodyDur: 0.05, vol: 0.32 },
    rifle:    { noiseDur: 0.11, cut0: 4200, cut1: 900,  body0: 150, body1: 48, bodyDur: 0.09, vol: 0.42 },
    burst:    { noiseDur: 0.09, cut0: 4600, cut1: 1100, body0: 175, body1: 60, bodyDur: 0.07, vol: 0.38 },
    shotgun:  { noiseDur: 0.38, cut0: 2200, cut1: 260,  body0: 95,  body1: 32, bodyDur: 0.26, vol: 0.85 },
    dmr:      { noiseDur: 0.2,  cut0: 5200, cut1: 900,  body0: 115, body1: 40, bodyDur: 0.15, vol: 0.6 },
    lmg:      { noiseDur: 0.12, cut0: 3600, cut1: 700,  body0: 125, body1: 42, bodyDur: 0.1,  vol: 0.45 },
    sniper:   { noiseDur: 0.55, cut0: 6500, cut1: 350,  body0: 85,  body1: 28, bodyDur: 0.38, vol: 0.95 },
    launcher: { noiseDur: 0.16, cut0: 900,  cut1: 200,  body0: 240, body1: 60, bodyDur: 0.22, vol: 0.6 },
    enemy:    { noiseDur: 0.1,  cut0: 2600, cut1: 700,  body0: 130, body1: 50, bodyDur: 0.08, vol: 0.32 },
    heavy:    { noiseDur: 0.08, cut0: 2000, cut1: 600,  body0: 100, body1: 45, bodyDur: 0.06, vol: 0.28 },
    esniper:  { noiseDur: 0.45, cut0: 5600, cut1: 400,  body0: 90,  body1: 30, bodyDur: 0.3,  vol: 0.75 },
    boss:     { noiseDur: 0.14, cut0: 1800, cut1: 300,  body0: 320, body1: 80, bodyDur: 0.12, vol: 0.36, square: true }
  };

  /** D minor progression: i - VI - VII - v, one chord per bar. */
  const PROGRESSION = [
    { root: 38, tones: [0, 3, 7] }, { root: 34, tones: [0, 4, 7] },
    { root: 36, tones: [0, 4, 7] }, { root: 33, tones: [0, 3, 7] }
  ];
  const MUSIC_MODES = {
    menu:    { bpm: 84,  pad: 0.11, drone: 0.09, arp: 0.05, bass: 0,    kick: 0,    snare: 0,    hat: 0 },
    explore: { bpm: 92,  pad: 0.08, drone: 0.08, arp: 0.025, bass: 0.07, kick: 0.12, snare: 0,    hat: 0.025 },
    combat:  { bpm: 124, pad: 0.06, drone: 0.05, arp: 0.05, bass: 0.12, kick: 0.5,  snare: 0.22, hat: 0.06 },
    boss:    { bpm: 140, pad: 0.07, drone: 0.08, arp: 0.06, bass: 0.15, kick: 0.6,  snare: 0.28, hat: 0.08 }
  };
  const midiToFreq = (m) => 440 * Math.pow(2, (m - 69) / 12);

  class AudioSystem {
    constructor() {
      this.ctx = null;
      this.volumes = { master: 0.8, music: 0.55, sfx: 0.85 };
      this.listenerX = 0;
      this.listenerY = 0;
      this.lastPlayed = Object.create(null);
      this.musicMode = 'off';
      this.pendingMode = null;
      this.step = 0;
      this.nextNoteTime = 0;
      this.schedulerId = null;
      this.ducked = false;
    }

    /** Must be called from a user gesture (browsers block autoplay). */
    unlock() {
      try {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          this.ctx = new AC();
          this._buildGraph();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
        if (this.musicMode !== 'off' && !this.schedulerId) this._startScheduler();
      } catch (err) { U.reportError('audio.unlock', err); }
    }

    _buildGraph() {
      const ctx = this.ctx;
      this.master = ctx.createGain();
      this.compressor = ctx.createDynamicsCompressor();
      this.compressor.threshold.value = -14;
      this.compressor.ratio.value = 5;
      this.master.connect(this.compressor).connect(ctx.destination);
      this.sfxBus = ctx.createGain();
      this.sfxBus.connect(this.master);
      this.musicBus = ctx.createGain();
      this.musicFilter = ctx.createBiquadFilter();
      this.musicFilter.type = 'lowpass';
      this.musicFilter.frequency.value = 18000;
      this.musicBus.connect(this.musicFilter).connect(this.master);
      // 2 seconds of white noise reused by every noise voice.
      const len = ctx.sampleRate * 2;
      this.noiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = this.noiseBuffer.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      this.applyVolumes();
    }

    setVolumes(settings) {
      this.volumes.master = settings.master;
      this.volumes.music = settings.music;
      this.volumes.sfx = settings.sfx;
      this.applyVolumes();
    }

    applyVolumes() {
      if (!this.ctx) return;
      const t = this.ctx.currentTime;
      this.master.gain.setTargetAtTime(this.volumes.master, t, 0.05);
      this.sfxBus.gain.setTargetAtTime(this.volumes.sfx, t, 0.05);
      this.musicBus.gain.setTargetAtTime(this.volumes.music * (this.ducked ? 0.45 : 1), t, 0.1);
    }

    duck(on) {
      this.ducked = on;
      if (!this.ctx) return;
      this.musicFilter.frequency.setTargetAtTime(on ? 700 : 18000, this.ctx.currentTime, 0.15);
      this.applyVolumes();
    }

    setListener(x, y) { this.listenerX = x; this.listenerY = y; }

    _ready() { return this.ctx && this.ctx.state === 'running'; }

    _throttle(name, gap) {
      const now = this.ctx.currentTime;
      if (this.lastPlayed[name] && now - this.lastPlayed[name] < gap) return false;
      this.lastPlayed[name] = now;
      return true;
    }

    /** Converts a world position into {vol, pan} relative to the listener. */
    spatial(x, y) {
      if (x === undefined) return { vol: 1, pan: 0 };
      const dx = x - this.listenerX, dy = y - this.listenerY;
      const d = Math.sqrt(dx * dx + dy * dy);
      return { vol: U.clamp(1 - d / MAX_HEAR_DIST, 0, 1), pan: U.clamp(dx / 700, -1, 1) };
    }

    _out(dest, vol, pan) {
      const g = this.ctx.createGain();
      g.gain.value = vol;
      if (pan && this.ctx.createStereoPanner) {
        const p = this.ctx.createStereoPanner();
        p.pan.value = pan;
        g.connect(p).connect(dest || this.sfxBus);
      } else {
        g.connect(dest || this.sfxBus);
      }
      return g;
    }

    /** Pitched oscillator voice with exponential decay. */
    tone(o) {
      const ctx = this.ctx, t = (o.when || ctx.currentTime);
      const osc = ctx.createOscillator();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(o.freq, t);
      if (o.freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(o.freqEnd, 1), t + o.dur);
      if (o.detune) osc.detune.value = o.detune;
      const env = ctx.createGain();
      const attack = o.attack || 0.004;
      env.gain.setValueAtTime(0.0001, t);
      env.gain.exponentialRampToValueAtTime(Math.max(o.vol, 0.0002), t + attack);
      env.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
      let node = osc;
      if (o.filter) {
        const f = ctx.createBiquadFilter();
        f.type = o.filter;
        f.frequency.value = o.filterFreq || 1200;
        f.Q.value = o.q || 0.7;
        osc.connect(f);
        node = f;
      }
      node.connect(env).connect(o.out || this._out(o.dest, 1, o.pan));
      osc.start(t);
      osc.stop(t + o.dur + 0.05);
    }

    /** Filtered white noise voice. */
    noise(o) {
      const ctx = this.ctx, t = (o.when || ctx.currentTime);
      const src = ctx.createBufferSource();
      src.buffer = this.noiseBuffer;
      src.playbackRate.value = o.rate || 1;
      const f = ctx.createBiquadFilter();
      f.type = o.filter || 'lowpass';
      f.frequency.setValueAtTime(o.freq || 2000, t);
      if (o.freqEnd) f.frequency.exponentialRampToValueAtTime(Math.max(o.freqEnd, 20), t + o.dur);
      f.Q.value = o.q || 0.8;
      const env = ctx.createGain();
      env.gain.setValueAtTime(0.0001, t);
      env.gain.exponentialRampToValueAtTime(Math.max(o.vol, 0.0002), t + (o.attack || 0.003));
      env.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
      src.connect(f).connect(env).connect(o.out || this._out(o.dest, 1, o.pan));
      src.start(t, Math.random() * 0.3);
      src.stop(t + o.dur + 0.05);
    }

    /* ----------------------------- SFX ----------------------------- */
    shot(kind, x, y, pitch) {
      if (!this._ready()) return;
      const p = SHOT_PROFILES[kind] || SHOT_PROFILES.rifle;
      if (!this._throttle('shot:' + kind, 0.028)) return;
      const s = this.spatial(x, y);
      if (s.vol <= 0.01) return;
      const k = pitch || 1;
      const out = this._out(this.sfxBus, p.vol * s.vol, s.pan);
      this.noise({ dur: p.noiseDur, freq: p.cut0 * k, freqEnd: p.cut1, vol: 1, out });
      this.tone({ type: p.square ? 'square' : 'sine', freq: p.body0 * k, freqEnd: p.body1, dur: p.bodyDur, vol: 0.9, out });
      this.noise({ dur: 0.02, filter: 'highpass', freq: 5000, vol: 0.5, out });
    }

    reloadStart() {
      if (!this._ready()) return;
      const out = this._out(this.sfxBus, 0.35, 0);
      this.noise({ dur: 0.05, filter: 'bandpass', freq: 2200, q: 4, vol: 0.9, out });
      this.tone({ type: 'square', freq: 520, freqEnd: 300, dur: 0.06, vol: 0.25, out, filter: 'lowpass', filterFreq: 1800 });
    }

    reloadEnd() {
      if (!this._ready()) return;
      const out = this._out(this.sfxBus, 0.4, 0);
      const t = this.ctx.currentTime;
      this.noise({ when: t, dur: 0.04, filter: 'bandpass', freq: 1700, q: 5, vol: 1, out });
      this.noise({ when: t + 0.09, dur: 0.12, filter: 'bandpass', freq: 900, freqEnd: 2600, q: 2, vol: 0.7, out });
      this.tone({ when: t + 0.09, type: 'square', freq: 260, freqEnd: 180, dur: 0.05, vol: 0.2, out, filter: 'lowpass', filterFreq: 1400 });
    }

    empty() {
      if (!this._ready() || !this._throttle('empty', 0.18)) return;
      this.tone({ type: 'square', freq: 1500, freqEnd: 900, dur: 0.035, vol: 0.12, filter: 'lowpass', filterFreq: 3000 });
    }

    impact(x, y, kind) {
      if (!this._ready() || !this._throttle('impact', 0.035)) return;
      const s = this.spatial(x, y);
      if (s.vol < 0.05) return;
      const out = this._out(this.sfxBus, 0.2 * s.vol, s.pan);
      if (kind === 'metal') {
        this.tone({ type: 'triangle', freq: U.rand(2200, 3600), freqEnd: 1500, dur: 0.08, vol: 0.5, out });
      }
      this.noise({ dur: 0.06, filter: 'highpass', freq: 1800, vol: 0.8, out });
    }

    enemyHit(x, y, crit) {
      if (!this._ready() || !this._throttle('ehit', 0.03)) return;
      const s = this.spatial(x, y);
      const out = this._out(this.sfxBus, 0.32 * Math.max(s.vol, 0.3), s.pan);
      this.tone({ type: 'sine', freq: crit ? 520 : 330, freqEnd: 140, dur: 0.07, vol: 0.9, out });
      this.noise({ dur: 0.05, filter: 'bandpass', freq: 1300, q: 1.5, vol: 0.6, out });
      if (crit) this.tone({ type: 'triangle', freq: 1900, freqEnd: 1300, dur: 0.09, vol: 0.4, out });
    }

    hitmarker() {
      if (!this._ready() || !this._throttle('hitmarker', 0.05)) return;
      this.tone({ type: 'triangle', freq: 2600, freqEnd: 2000, dur: 0.04, vol: 0.06 });
    }

    enemyDeath(x, y) {
      if (!this._ready()) return;
      const s = this.spatial(x, y);
      const out = this._out(this.sfxBus, 0.45 * Math.max(s.vol, 0.25), s.pan);
      this.tone({ type: 'sawtooth', freq: 420, freqEnd: 50, dur: 0.42, vol: 0.5, out, filter: 'lowpass', filterFreq: 1400 });
      this.noise({ dur: 0.3, freq: 1800, freqEnd: 200, vol: 0.7, out });
    }

    explosion(x, y, big) {
      if (!this._ready() || !this._throttle('explosion', 0.04)) return;
      const s = this.spatial(x, y);
      const out = this._out(this.sfxBus, (big ? 1 : 0.8) * Math.max(s.vol, 0.15), s.pan);
      this.noise({ dur: big ? 1.6 : 1.1, freq: 1400, freqEnd: 90, vol: 1, out, attack: 0.005 });
      this.tone({ type: 'sine', freq: 90, freqEnd: 24, dur: big ? 1.0 : 0.7, vol: 1, out });
      this.noise({ dur: 0.08, filter: 'highpass', freq: 3000, vol: 0.6, out });
    }

    playerHurt() {
      if (!this._ready() || !this._throttle('hurt', 0.12)) return;
      const out = this._out(this.sfxBus, 0.5, 0);
      this.tone({ type: 'sine', freq: 190, freqEnd: 80, dur: 0.18, vol: 0.9, out });
      this.noise({ dur: 0.12, freq: 700, vol: 0.6, out });

    return !raycast(map, x0, y0, x1, y1, mode === undefined ? MODE.SIGHT : mode, scratchHit).hit;
  }

  /** Pushes a circle out of every overlapping blocking tile. */
  function resolveCircle(map, ent, r, mode) {
    let collided = false;
    const tx0 = Math.floor((ent.x - r) / TILE), tx1 = Math.floor((ent.x + r) / TILE);
    const ty0 = Math.floor((ent.y - r) / TILE), ty1 = Math.floor((ent.y + r) / TILE);
    for (let ty = ty0; ty <= ty1; ty++) {
      for (let tx = tx0; tx <= tx1; tx++) {

        const left = tx * TILE, top = ty * TILE;
        const px = U.clamp(ent.x, left, left + TILE), py = U.clamp(ent.y, top, top + TILE);
        let ddx = ent.x - px, ddy = ent.y - py;
        const d2 = ddx * ddx + ddy * ddy;
        if (d2 >= r * r) continue;
        collided = true;
        if (d2 > 1e-6) {
          const d = Math.sqrt(d2);
          const push = r - d;
          ent.x += ddx / d * push;
          ent.y += ddy / d * push;

          const cx = left + TILE / 2, cy = top + TILE / 2;
          ddx = ent.x - cx; ddy = ent.y - cy;
          if (Math.abs(ddx) > Math.abs(ddy)) ent.x = ddx > 0 ? left + TILE + r : left - r;
          else ent.y = ddy > 0 ? top + TILE + r : top - r;
        }
      }
    }
    return collided;
  }

  /** Sub-stepped axis-separated movement, safe for fast dodges. */
  function moveCircle(map, ent, dx, dy, r, mode) {
    const m = mode === undefined ? MODE.MOVE : mode;
    const steps = U.clamp(Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / (r * 0.5)), 1, 10);
    const sx = dx / steps, sy = dy / steps;
    let collided = false;
    for (let i = 0; i < steps; i++) {
      ent.x += sx;
      if (resolveCircle(map, ent, r, m)) collided = true;
      ent.y += sy;
      if (resolveCircle(map, ent, r, m)) collided = true;
    }
    return collided;
  }

  BO.TILE_TYPE = TILE_TYPE;
  BO.COLLIDE = MODE;
  BO.TileMap = TileMap;
  BO.Collision = { raycast, lineOfSight, moveCircle, resolveCircle, makeHit };

  <script>
/* =========================================================================
 * BLACKOUT :: particles.js
 * Pooled particle system (sparks, smoke, debris, explosions, casings...),
 * persistent floor decals (bullet holes, scorch marks) and pooled floating
 * damage numbers / combat text.
 * ========================================================================= */
'use strict';
(function (BO) {
  const U = BO.U;
  const SHAPE = { DOT: 0, SPARK: 1, SHARD: 2, SMOKE: 3, RING: 4, CASING: 5, GLOW: 6 };
  const LAYER = { FLOOR: 0, AIR: 1 };
  const QUALITY = { low: { mult: 0.35, max: 450 }, medium: { mult: 0.7, max: 1000 }, high: { mult: 1, max: 2000 } };

  /** Cached soft radial sprites per colour, so smoke/glow never builds gradients per frame. */
  const spriteCache = Object.create(null);
  function softSprite(color) {
    let s = spriteCache[color];
    if (s) return s;
    s = document.createElement('canvas');
    s.width = s.height = 64;
    const g = s.getContext('2d');
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, U.rgba(color, 1));
    grad.addColorStop(0.4, U.rgba(color, 0.45));
    grad.addColorStop(1, U.rgba(color, 0));
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    spriteCache[color] = s;
    return s;
  }

  function makeParticle() {
    return { active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 1, size1: 1, color: '#fff',
      alpha: 1, grav: 0, drag: 0, rot: 0, vrot: 0, shape: 0, additive: false, layer: 1 };
  }

  class ParticleSystem {
    constructor() {
      this.pool = new BO.Pool(makeParticle, 600, QUALITY.high.max);
      this.quality = QUALITY.high;
      this.decals = new Array(BO.CONFIG.MAX_DECALS);
      this.decalHead = 0;
      for (let i = 0; i < this.decals.length; i++) this.decals[i] = { active: false, x: 0, y: 0, type: 0, size: 0, rot: 0, alpha: 0 };
    }

    setQuality(level) {
      this.quality = QUALITY[level] || QUALITY.high;
      this.pool.setMaxSize(this.quality.max);
    }

    clear() {
      this.pool.releaseAll();
      for (let i = 0; i < this.decals.length; i++) this.decals[i].active = false;
    }

    count(n) { return Math.max(1, Math.round(n * this.quality.mult)); }

    spawn(x, y, vx, vy, life, size, size1, color, shape, opts) {
      const p = this.pool.acquire();
      if (!p) return null;
      p.x = x; p.y = y; p.vx = vx; p.vy = vy;
      p.life = p.max = life;
      p.size = size; p.size1 = size1;
      p.color = color; p.shape = shape;
      p.alpha = opts && opts.alpha !== undefined ? opts.alpha : 1;
      p.grav = opts && opts.grav ? opts.grav : 0;
      p.drag = opts && opts.drag !== undefined ? opts.drag : 2;
      p.rot = opts && opts.rot !== undefined ? opts.rot : Math.random() * U.TAU;
      p.vrot = opts && opts.vrot ? opts.vrot : 0;
      p.additive = !!(opts && opts.additive);
      p.layer = opts && opts.layer !== undefined ? opts.layer : LAYER.AIR;
      return p;
    }

    /* ----------------------------- Emitters ----------------------------- */
    muzzleFlash(x, y, angle, scale, color) {
      const n = this.count(5 * scale);
      for (let i = 0; i < n; i++) {
        const a = angle + U.randSpread() * 0.45;
        const sp = U.rand(250, 650) * scale;
        this.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp, U.rand(0.05, 0.12), U.rand(1.5, 3) * scale, 0.5, color, SHAPE.SPARK, { additive: true, drag: 8 });
      }
      this.spawn(x, y, 0, 0, 0.06, 20 * scale, 6, color, SHAPE.GLOW, { additive: true, drag: 0 });
      this.spawn(x + Math.cos(angle) * 6, y + Math.sin(angle) * 6, Math.cos(angle) * 40, Math.sin(angle) * 40, 0.5, 5 * scale, 16 * scale, '#5a5d70', SHAPE.SMOKE, { alpha: 0.22, drag: 2 });
    }

    sparks(x, y, normalAngle, n, color, speed) {
      const c = this.count(n);
      for (let i = 0; i < c; i++) {
        const a = normalAngle + U.randSpread() * 1.1;
        const sp = U.rand(120, speed || 520);
        this.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp, U.rand(0.12, 0.35), U.rand(1, 2.2), 0.3, color, SHAPE.SPARK, { additive: true, drag: 5, grav: 260 });
      }
    }

    impactDust(x, y, normalAngle, color) {
      const c = this.count(3);
      for (let i = 0; i < c; i++) {
        const a = normalAngle + U.randSpread() * 0.8;
        const sp = U.rand(20, 90);
        this.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp, U.rand(0.35, 0.7), U.rand(3, 5), U.rand(9, 14), color || '#6b6f80', SHAPE.SMOKE, { alpha: 0.3, drag: 3 });
      }
    }

    /** Blood-free hit effect: energy shards and a bright pop. */
    hitEffect(x, y, angle, color, crit) {
      const c = this.count(crit ? 12 : 7);
      for (let i = 0; i < c; i++) {
        const a = angle + U.randSpread() * 0.9;
        const sp = U.rand(140, crit ? 520 : 380);
        this.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp, U.rand(0.15, 0.32), U.rand(1.5, 3), 0.4, color, i % 3 === 0 ? SHAPE.SHARD : SHAPE.SPARK, { additive: true, drag: 6, vrot: U.rand(-12, 12) });
      }
      this.spawn(x, y, 0, 0, 0.1, crit ? 22 : 13, 2, color, SHAPE.GLOW, { additive: true });
    }

    smoke(x, y, n, color, spread) {
      const c = this.count(n);
      for (let i = 0; i < c; i++) {
        const a = Math.random() * U.TAU, sp = U.rand(10, spread || 60);
        this.spawn(x + U.randSpread() * 10, y + U.randSpread() * 10, Math.cos(a) * sp, Math.sin(a) * sp, U.rand(0.8, 1.8), U.rand(8, 14), U.rand(28, 46), color || '#3a3d4c', SHAPE.SMOKE, { alpha: 0.35, drag: 1.2 });
      }
    }

    debris(x, y, color, n, speed) {
      const c = this.count(n);
      for (let i = 0; i < c; i++) {
        const a = Math.random() * U.TAU, sp = U.rand(80, speed || 380);
        this.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp, U.rand(0.6, 1.4), U.rand(2.5, 6), U.rand(2, 4), color, SHAPE.SHARD, { drag: 3.5, vrot: U.rand(-14, 14), layer: LAYER.FLOOR });
      }
    }

    explosion(x, y, radius) {
      const k = radius / 120;
      this.spawn(x, y, 0, 0, 0.18, radius * 0.6, radius * 1.4, '#fff1c9', SHAPE.GLOW, { additive: true });
      this.spawn(x, y, 0, 0, 0.45, radius * 0.2, radius * 1.15, '#ff9a3c', SHAPE.RING, { additive: true, alpha: 0.9 });
      const fire = this.count(26 * k);
      for (let i = 0; i < fire; i++) {
        const a = Math.random() * U.TAU, sp = U.rand(60, 340) * k;
        this.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp, U.rand(0.25, 0.6), U.rand(10, 20) * k, U.rand(2, 6), U.pick(['#ffb347', '#ff7a1a', '#ffd27a']), SHAPE.GLOW, { additive: true, drag: 3.5 });
      }
      this.sparks(x, y, 0, 26 * k, '#ffcf6b', 900 * k);
      this.smoke(x, y, 16 * k, '#2c2e3a', 140 * k);
      this.debris(x, y, '#4a4c5a', 12 * k, 520 * k);
    }

    deathEffect(x, y, color) {
      const c = this.count(22);
      for (let i = 0; i < c; i++) {
        const a = Math.random() * U.TAU, sp = U.rand(60, 260);
        this.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp, U.rand(0.4, 0.9), U.rand(2, 4), 0.5, i % 2 ? color : '#c9ccd8', SHAPE.SHARD, { additive: i % 2 === 1, drag: 4, vrot: U.rand(-10, 10) });
      }
      this.spawn(x, y, 0, 0, 0.4, 10, 60, color, SHAPE.RING, { additive: true });
      this.smoke(x, y, 5, '#2a2c38', 40);
    }

    pickupBurst(x, y, color) {
      this.spawn(x, y, 0, 0, 0.4, 6, 46, color, SHAPE.RING, { additive: true });
      const c = this.count(14);
      for (let i = 0; i < c; i++) {
        const a = (i / c) * U.TAU, sp = U.rand(120, 220);
        this.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp, 0.4, 2.5, 0.5, color, SHAPE.DOT, { additive: true, drag: 5 });
      }
    }

    shellCasing(x, y, angle, big) {
      const a = angle + Math.PI / 2 + U.randSpread() * 0.4;
      const sp = U.rand(90, 170);
      this.spawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp, 5, big ? 4 : 3, big ? 4 : 3, big ? '#c9a248' : '#d8b25a', SHAPE.CASING, { drag: 5, vrot: U.rand(-25, 25), layer: LAYER.FLOOR });
    }

    dust(x, y, n) {
      const c = this.count(n);
      for (let i = 0; i < c; i++) {
        this.spawn(x + U.randSpread() * 8, y + U.randSpread() * 8, U.randSpread() * 40, U.randSpread() * 40, U.rand(0.3, 0.6), 3, 10, '#555a6c', SHAPE.SMOKE, { alpha: 0.25, drag: 3, layer: LAYER.FLOOR });
      }
    }

    trail(x, y, color, size) {
      this.spawn(x, y, 0, 0, 0.25, size || 4, 0.5, color, SHAPE.GLOW, { additive: true, drag: 0 });
    }

    /* ------------------------------ Decals ------------------------------ */
    addDecal(x, y, type, size) {
      const d = this.decals[this.decalHead];
      this.decalHead = (this.decalHead + 1) % this.decals.length;
      d.active = true; d.x = x; d.y = y; d.type = type; d.size = size; d.rot = Math.random() * U.TAU; d.alpha = 1;
    }

    /* --------------------------- Update/Render -------------------------- */
    update(dt) {
      const items = this.pool.items;
      for (let i = 0; i < items.length; i++) {
        const p = items[i];
        if (!p.active) continue;
        p.life -= dt;
        if (p.life <= 0) { this.pool.release(p); continue; }
        const damping = Math.max(0, 1 - p.drag * dt);
        p.vx *= damping; p.vy *= damping;
        p.vy += p.grav * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.rot += p.vrot * dt;
        if (p.vrot !== 0) p.vrot *= damping;
      }
    }

    renderDecals(ctx, rect) {
      for (let i = 0; i < this.decals.length; i++) {
        const d = this.decals[i];
        if (!d.active || d.x < rect.x0 || d.x > rect.x1 || d.y < rect.y0 || d.y > rect.y1) continue;
        if (d.type === 0) { // bullet hole
          ctx.fillStyle = 'rgba(8,8,12,0.75)';
          ctx.beginPath(); ctx.arc(d.x, d.y, d.size, 0, U.TAU); ctx.fill();
          ctx.fillStyle = 'rgba(120,120,135,0.25)';
          ctx.beginPath(); ctx.arc(d.x - 0.6, d.y - 0.6, d.size * 0.5, 0, U.TAU); ctx.fill();
        } else { // scorch
          ctx.globalAlpha = 0.55;
          ctx.drawImage(softSprite('#050507'), d.x - d.size, d.y - d.size, d.size * 2, d.size * 2);
          ctx.globalAlpha = 1;
        }
      }
    }

    /** Draws one layer; additive particles are drawn in their own pass. */
    render(ctx, rect, layer, additive) {
      const items = this.pool.items;
      ctx.globalCompositeOperation = additive ? 'lighter' : 'source-over';
      for (let i = 0; i < items.length; i++) {
        const p = items[i];
        if (!p.active || p.layer !== layer || p.additive !== additive) continue;
        if (p.x < rect.x0 || p.x > rect.x1 || p.y < rect.y0 || p.y > rect.y1) continue;
        const t = 1 - p.life / p.max;
        const size = p.size + (p.size1 - p.size) * t;
        let a = p.alpha * (p.shape === SHAPE.CASING ? Math.min(1, p.life) : (1 - t));
        if (a <= 0.01) continue;

            ctx.strokeStyle = p.color;
            ctx.lineWidth = size;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03);
            ctx.stroke();
            break;
          }
          case SHAPE.SHARD:
          case SHAPE.CASING: {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            if (p.shape === SHAPE.CASING) ctx.fillRect(-size * 0.5, -size * 0.25, size, size * 0.5);
            else ctx.fillRect(-size / 2, -size / 2, size, size * 0.6);
            ctx.restore();
            break;
          }
          case SHAPE.SMOKE:
          case SHAPE.GLOW: {
            ctx.drawImage(softSprite(p.color), p.x - size, p.y - size, size * 2, size * 2);
            break;
          }
          case SHAPE.RING: {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = Math.max(1, 4 * (1 - t));
            ctx.beginPath(); ctx.arc(p.x, p.y, size, 0, U.TAU); ctx.stroke();
            break;
          }
          default: {
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, size, 0, U.TAU); ctx.fill();
          }
        }
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  /** Pooled floating combat text (damage numbers, "HEADSHOT", XP...). */
  class FloatingTextSystem {
    constructor() {
      this.pool = new BO.Pool(() => ({ active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, text: '', color: '#fff', size: 16, pop: 0 }), 64, 160);
    }
    clear() { this.pool.releaseAll(); }
    spawn(x, y, text, color, size, life) {
      const f = this.pool.acquire();
      if (!f) return;
      f.x = x + U.randSpread() * 10; f.y = y;
      f.vx = U.randSpread() * 30; f.vy = -90;
      f.life = f.max = life || 0.9;
      f.text = text; f.color = color; f.size = size || 16; f.pop = 1;
    }
    update(dt) {
      const items = this.pool.items;
      for (let i = 0; i < items.length; i++) {
        const f = items[i];
        if (!f.active) continue;
        f.life -= dt;
        if (f.life <= 0) { this.pool.release(f); continue; }
        f.x += f.vx * dt; f.y += f.vy * dt;
        f.vy *= Math.max(0, 1 - 2.5 * dt);
        f.pop = Math.max(0, f.pop - dt * 6);
      }
    }
    render(ctx) {
      const items = this.pool.items;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      for (let i = 0; i < items.length; i++) {
        const f = items[i];
        if (!f.active) continue;
        const t = f.life / f.max;
        ctx.globalAlpha = Math.min(1, t * 2.5);
        ctx.font = BO.I18N.font(f.size * (1 + f.pop * 0.5), 700, 'display');
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(5,6,14,0.85)';
        ctx.strokeText(f.text, f.x, f.y);
        ctx.fillStyle = f.color;
        ctx.fillText(f.text, f.x, f.y);
      }
      ctx.globalAlpha = 1;
    }
  }

  BO.PARTICLE_SHAPE = SHAPE;
  BO.PARTICLE_LAYER = LAYER;
  BO.softSprite = softSprite;
  BO.ParticleSystem = ParticleSystem;
  BO.FloatingTextSystem = FloatingTextSystem;
})(window.BO);

/* =========================================================================
 * BLACKOUT :: projectiles.js
 * Pooled bullets with continuous (swept) collision against tiles, props and
 * actors so fast rounds never tunnel through walls or enemies.
 * ========================================================================= */
'use strict';
(function (BO) {
  const U = BO.U;
  const C = BO.Collision;
  const OWNER = { PLAYER: 0, ENEMY: 1 };
  const KIND = { TRACER: 0, ORB: 1, GRENADE: 2, SNIPER: 3 };
  const MAX_PROJECTILES = 700;

  function makeProjectile() {
    return { active: false, x: 0, y: 0, vx: 0, vy: 0, dirX: 0, dirY: 0, speed: 0, damage: 0, rangeLeft: 0, traveled: 0,
      owner: 0, kind: 0, color: '#fff', width: 2, pierce: 0, explosive: 0, knockback: 0, hitStop: 0, critChance: 0,
      lastHit: null, source: null, radius: 0 };
  }

  /** Reusable spawn descriptor: fill it and pass it to spawn() to avoid per-shot allocations. */
  const SHOT = { x: 0, y: 0, angle: 0, speed: 0, damage: 0, range: 0, owner: 0, kind: 0, color: '#fff', width: 2,
    pierce: 0, explosive: 0, knockback: 0, hitStop: 0, critChance: 0, source: null, radius: 0 };

  class ProjectileSystem {
    constructor() {
      this.pool = new BO.Pool(makeProjectile, 200, MAX_PROJECTILES);
      this.hit = C.makeHit();
    }

    clear() { this.pool.releaseAll(); }

    spawn(s) {
      const p = this.pool.acquire();
      if (!p) return null;
      p.x = s.x; p.y = s.y;
      p.dirX = Math.cos(s.angle); p.dirY = Math.sin(s.angle);
      p.speed = s.speed;
      p.vx = p.dirX * s.speed; p.vy = p.dirY * s.speed;
      p.damage = s.damage; p.rangeLeft = s.range; p.traveled = 0;
      p.owner = s.owner; p.kind = s.kind; p.color = s.color; p.width = s.width;
      p.pierce = s.pierce || 0; p.explosive = s.explosive || 0; p.knockback = s.knockback || 0;
      p.hitStop = s.hitStop || 0; p.critChance = s.critChance || 0; p.source = s.source || null;
      p.radius = s.radius || 0; p.lastHit = null;
      return p;
    }

    update(dt, game) {
      const items = this.pool.items;
      for (let i = 0; i < items.length; i++) {
        const p = items[i];
        if (!p.active) continue;
        U.safe('projectile.update', () => this._step(p, dt, game));
      }
    }

    _step(p, dt, game) {
      let stepLen = p.speed * dt;
      if (stepLen > p.rangeLeft) stepLen = p.rangeLeft;
      const ex = p.x + p.dirX * stepLen, ey = p.y + p.dirY * stepLen;
      const wall = C.raycast(game.map, p.x, p.y, ex, ey, BO.COLLIDE.BULLET, this.hit);
      const wallT = wall.hit ? wall.t : 1;
      const pad = p.radius;

      // Find the earliest actor intersection along the swept segment.
      let bestT = wallT, target = null;
      if (p.owner === OWNER.PLAYER) {
        const list = game.enemies;
        for (let k = 0; k < list.length; k++) {
          const e = list[k];
          if (e.dead || e === p.lastHit) continue;
          const reach = stepLen + e.r + pad;
          if (Math.abs(e.x - p.x) > reach || Math.abs(e.y - p.y) > reach) continue;
          const t = U.segmentCircle(p.x, p.y, ex, ey, e.x, e.y, e.r + pad);
          if (t >= 0 && t < bestT) { bestT = t; target = e; }
        }
      } else if (game.player && !game.player.dead) {
        const pl = game.player;
        const t = U.segmentCircle(p.x, p.y, ex, ey, pl.x, pl.y, pl.r + pad);
        if (t >= 0 && t < bestT) {
          if (pl.isInvulnerable()) {
            if (!p.lastHit) game.onBulletDodged(p);
            p.lastHit = pl; // graze: the round passes through during i-frames
          } else { bestT = t; target = pl; }
        }
      }

      const hx = p.x + (ex - p.x) * bestT, hy = p.y + (ey - p.y) * bestT;
      if (target) {
        p.traveled += stepLen * bestT;
        if (p.explosive) { game.explode(hx, hy, p.explosive, p.damage, p.owner === OWNER.PLAYER ? 'player' : 'enemy'); this.pool.release(p); return; }
        if (p.owner === OWNER.PLAYER) game.onEnemyHitByBullet(target, p, hx, hy);
        else game.onPlayerHitByBullet(p, hx, hy);
        if (p.pierce > 0 && p.owner === OWNER.PLAYER) {
          p.pierce--;
          p.lastHit = target;
          p.damage *= 0.75;
          p.x = hx; p.y = hy;
          p.rangeLeft -= stepLen * bestT;
          if (p.rangeLeft <= 1) this.pool.release(p);
        } else {
          this.pool.release(p);
        }
        return;
      }
      if (wall.hit) {
        p.traveled += stepLen * wallT;
        p.x = wall.x; p.y = wall.y;
        if (p.explosive) game.explode(wall.x - p.dirX * 6, wall.y - p.dirY * 6, p.explosive, p.damage, p.owner === OWNER.PLAYER ? 'player' : 'enemy');
        else game.onBulletHitWorld(p, wall);
        this.pool.release(p);
        return;
      }
      p.x = ex; p.y = ey;
      p.traveled += stepLen;
      p.rangeLeft -= stepLen;
      if (p.kind === KIND.GRENADE && game.particles) game.particles.trail(p.x, p.y, '#ff9a3c', 5);
      if (p.rangeLeft <= 0.5) {
        if (p.explosive) game.explode(p.x, p.y, p.explosive, p.damage, p.owner === OWNER.PLAYER ? 'player' : 'enemy');
        this.pool.release(p);
      }
    }

    render(ctx, rect) {
      const items = this.pool.items;
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      for (let i = 0; i < items.length; i++) {
        const p = items[i];
        if (!p.active || p.x < rect.x0 || p.x > rect.x1 || p.y < rect.y0 || p.y > rect.y1) continue;
        if (p.kind === KIND.ORB || p.kind === KIND.GRENADE) {
          const r = p.kind === KIND.ORB ? 6 : 5;
          ctx.globalAlpha = 0.45;
          ctx.drawImage(BO.softSprite(p.color), p.x - r * 3, p.y - r * 3, r * 6, r * 6);
          ctx.globalAlpha = 1;
          ctx.fillStyle = p.kind === KIND.ORB ? '#ffe0e6' : '#ffd29a';
          ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.6, 0, U.TAU); ctx.fill();
          continue;
        }
        const tail = Math.min(p.traveled, p.owner === OWNER.PLAYER ? p.speed * 0.028 : p.speed * 0.045);
        const tx = p.x - p.dirX * tail, ty = p.y - p.dirY * tail;
        ctx.strokeStyle = p.color;
        ctx.globalAlpha = 0.22;
        ctx.lineWidth = p.width * 3.2;
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(p.x, p.y); ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.lineWidth = p.width;
        ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(p.x, p.y); ctx.stroke();
        if (p.owner === OWNER.ENEMY) {
          ctx.fillStyle = '#ffd0d8';
          ctx.beginPath(); ctx.arc(p.x, p.y, p.width * 0.9, 0, U.TAU); ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  BO.PROJECTILE_OWNER = OWNER;
  BO.PROJECTILE_KIND = KIND;
  BO.SHOT = SHOT;
  BO.ProjectileSystem = ProjectileSystem;
})(window.BO);

      this.iframes = Math.max(0, this.iframes - dt);
      this.hurtFlash = Math.max(0, this.hurtFlash - dt);
      this.dodgeCooldown = Math.max(0, this.dodgeCooldown - dt);
      this.switchTimer = Math.max(0, this.switchTimer - dt);
      this.fireBuffer = Math.max(0, this.fireBuffer - dt);
      this.recoilAnim = Math.max(0, this.recoilAnim - dt * 9);
      this.muzzleTimer = Math.max(0, this.muzzleTimer - dt);
      for (const k in this.powerups) if (this.powerups[k] > 0) this.powerups[k] = Math.max(0, this.powerups[k] - dt);
    }

    _updateAim(game) {
      this.aimX = game.camera.screenToWorldX(game.input.cursorX);
      this.aimY = game.camera.screenToWorldY(game.input.cursorY);
      const dx = this.aimX - this.x, dy = this.aimY - this.y;
      if (dx * dx + dy * dy > 4) this.angle = Math.atan2(dy, dx);
    }

    _updateMovement(dt, input, game) {
      const mv = input.moveVector(this._move);
      const moving = mv.x !== 0 || mv.y !== 0;
      const wantsSprint = (input.isDown('ShiftLeft') || input.isDown('ShiftRight')) && moving && !input.mouseDown;
      this.sprinting = wantsSprint && this.stamina > 1 && !this.weapon.reloading;
      if (this.sprinting) this.stamina = Math.max(0, this.stamina - CFG.STAMINA_DRAIN * dt);
      else this.stamina = Math.min(CFG.STAMINA_MAX, this.stamina + CFG.STAMINA_REGEN * dt);

      if (input.wasPressed('Space') && this.dodgeCooldown <= 0 && !this.isDodging) this._startDodge(mv, game);

      if (this.isDodging) {
        this.dodgeTimer -= dt;
        const t = 1 - this.dodgeTimer / CFG.DODGE_DURATION;
        const speed = CFG.DODGE_SPEED * (1 - 0.55 * t * t);
        this.vx = this.dodgeDirX * speed;
        this.vy = this.dodgeDirY * speed;
      } else {
        let speed = CFG.PLAYER_BASE_SPEED * this.speedMul * this.weapon.def.moveMul;
        if (this.sprinting) speed *= CFG.SPRINT_MULTIPLIER;
        if (this.powerups.speed > 0) speed *= POWERUP_EFFECT.speed;
        if (this.weapon.reloading) speed *= 0.9;
        this.vx = U.damp(this.vx, mv.x * speed, ACCEL_LAMBDA, dt);
        this.vy = U.damp(this.vy, mv.y * speed, ACCEL_LAMBDA, dt);

      const spd = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      this.walkCycle += spd * dt * 0.055;
      if (this.sprinting && Math.random() < dt * 10) game.particles.dust(this.x, this.y + 6, 1);
    }

    _startDodge(mv, game) {
      let dx = mv.x, dy = mv.y;
      if (dx === 0 && dy === 0) { dx = Math.cos(this.angle); dy = Math.sin(this.angle); }
      this.dodgeDirX = dx; this.dodgeDirY = dy;
      this.dodgeTimer = CFG.DODGE_DURATION;
      this.iframes = CFG.DODGE_IFRAMES;
      this.dodgeCooldown = CFG.DODGE_COOLDOWN;
      game.audio.dodge();
      game.particles.dust(this.x, this.y, 6);
    }

    _updateWeapons(dt, input, game) {
      for (let i = 0; i < SLOT_COUNT; i++) if (this.slots[i]) this.slots[i].update(i === this.current ? dt : dt * 0.5, i === this.current ? game.audio : null);
      for (let i = 0; i < SLOT_COUNT; i++) if (input.wasPressed('Digit' + (i + 1)) || input.wasPressed('Numpad' + (i + 1))) this.equip(i, game.audio);
      if (input.wheel !== 0) this.cycleWeapon(input.wheel > 0 ? 1 : -1, game.audio);
      const w = this.weapon;
      if (input.wasPressed('KeyR')) w.startReload(game.audio);
      if (input.mousePressed) this.fireBuffer = FIRE_BUFFER;
      if (this.isDodging || this.switchTimer > 0 || game.blockFire) return;
      const pressed = this.fireBuffer > 0;
      if ((input.mouseDown || pressed) && w.mag <= 0 && !w.reloading) {
        if (input.mousePressed) game.audio.empty();
        if (!w.startReload(game.audio) && input.mousePressed) game.onPlayerOutOfAmmo();
        return;
      }
      if (w.pullTrigger(input.mouseDown, pressed, this.rateMul()) > 0) {
        this.fireBuffer = 0;
        this._fire(game, w);
        if (w.mag <= 0) w.startReload(game.audio);
      }
    }

    _fire(game, w) {
      const def = w.def;
      const ca = Math.cos(this.angle), sa = Math.sin(this.angle);
      const handX = this.x - sa * 6, handY = this.y + ca * 6;
      const barrel = this.r + def.look.length * 0.9;
      let mx = handX + ca * barrel, my = handY + sa * barrel;
      // Never spawn the round on the far side of a wall we are hugging.
      const block = C.raycast(game.map, this.x, this.y, mx, my, BO.COLLIDE.BULLET);
      if (block.hit) { mx = this.x + (block.x - this.x) * 0.8; my = this.y + (block.y - this.y) * 0.8; }
      const speedFrac = Math.sqrt(this.vx * this.vx + this.vy * this.vy) / CFG.PLAYER_BASE_SPEED;
      const moveSpread = speedFrac * (def.id === 'sniper' ? 0.09 : 0.03) + (this.sprinting ? 0.06 : 0);
      const spread = w.currentSpread(moveSpread);

        S.speed = def.bulletSpeed * (def.pellets > 1 ? U.rand(0.85, 1.1) : 1);
        S.damage = w.stats.damage * this.damageMul();
        S.range = def.range * (def.pellets > 1 ? U.rand(0.85, 1.05) : 1);
        S.owner = BO.PROJECTILE_OWNER.PLAYER;
        S.kind = def.grenade ? BO.PROJECTILE_KIND.GRENADE : BO.PROJECTILE_KIND.TRACER;
        S.color = this.powerups.damage > 0 ? '#ff6a3d' : def.tracer;
        S.width = def.tracerWidth;
        S.pierce = def.pierce || 0;
        S.explosive = def.explosive || 0;
        S.knockback = def.knockback;
        S.hitStop = def.hitStop;
        S.critChance = CFG.BASE_CRIT_CHANCE;
        S.source = this;
        S.radius = def.grenade ? 4 : 0;
        game.projectiles.spawn(S);
      }

    }

    _updateAfterimages(dt) {
      for (let i = 0; i < AFTERIMAGES; i++) this.afterimages[i].life = Math.max(0, this.afterimages[i].life - dt);
      if (!this.isDodging) return;
      this.afterTimer -= dt;
      if (this.afterTimer > 0) return;
      this.afterTimer = 0.04;
      const a = this.afterimages[this.afterHead];
      this.afterHead = (this.afterHead + 1) % AFTERIMAGES;

    }

    /** Applies damage after armor. Returns the damage actually taken. */
    takeDamage(amount, srcX, srcY, game) {
      if (this.dead || this.isInvulnerable() || !(amount > 0)) return 0;
      let dmg = amount;
      if (this.armor > 0) {
        const absorbed = Math.min(this.armor, dmg * CFG.ARMOR_ABSORB);
        this.armor -= absorbed;

      }

        this.dead = true;

      }

    }

    knock(fx, fy) { if (!this.isDodging) { this.vx += fx; this.vy += fy; } }

    /* ------------------------------ Render ------------------------------ */
    draw(ctx, time) {
      const r = this.r;
      for (let i = 0; i < AFTERIMAGES; i++) {
        const a = this.afterimages[i];
        if (a.life <= 0) continue;

        ctx.beginPath(); ctx.arc(a.x, a.y, r * 0.9, 0, U.TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;

      if (this.dead) { this._drawDead(ctx); return; }

      // Ground shadow + facing chevron (direction indicator).
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath(); ctx.ellipse(this.x + 3, this.y + 6, r * 1.15, r * 0.95, 0, 0, U.TAU); ctx.fill();
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.globalAlpha = 0.55;
      ctx.strokeStyle = ACCENT;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(r + 14, -6); ctx.lineTo(r + 20, 0); ctx.lineTo(r + 14, 6); ctx.stroke();
      ctx.globalAlpha = 1;

      const roll = this.isDodging ? (1 - this.dodgeTimer / BO.CONFIG.DODGE_DURATION) : 0;
      const squash = this.isDodging ? 0.82 : 1;
      ctx.scale(squash, 1 / squash);

      // Feet: alternate with walk cycle for a stepping animation.
      const step = Math.sin(this.walkCycle) * 5;
      ctx.fillStyle = '#1b1e27';
      ctx.beginPath(); ctx.ellipse(step, -7, 5, 3.4, 0, 0, U.TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(-step, 7, 5, 3.4, 0, 0, U.TAU); ctx.fill();

      // Weapon, held on the right side with recoil and reload animation.
      const w = this.weapon;
      ctx.save();
      const reloadTilt = w.reloading ? Math.sin(w.reloadProgress * Math.PI) * 0.7 : 0;
      ctx.translate(2 - this.recoilAnim * 6, 6);
      ctx.rotate(reloadTilt + (this.switchTimer > 0 ? this.switchTimer * 3 : 0));
      BO.Weapons.drawWeaponShape(ctx, w.def, 1, ACCENT);
      ctx.restore();

      // Torso, pack and shoulder pads.
      ctx.fillStyle = '#20242f';
      ctx.fillRect(-r - 3, -8, 8, 16);
      ctx.fillStyle = this.hurtFlash > 0 ? '#ffffff' : '#2d3343';
      ctx.beginPath(); ctx.ellipse(0, 0, r * 0.85, r, 0, 0, U.TAU); ctx.fill();
      ctx.fillStyle = this.hurtFlash > 0 ? '#ffd3d3' : ACCENT;
      ctx.beginPath(); ctx.arc(1, -r * 0.78, 4.2, 0, U.TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(1, r * 0.78, 4.2, 0, U.TAU); ctx.fill();
      // Arms reaching to the weapon.
      ctx.strokeStyle = '#3a4152';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(2, r * 0.7); ctx.lineTo(12 - this.recoilAnim * 5, 7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(2, -r * 0.7); ctx.lineTo(20 - this.recoilAnim * 5, 5); ctx.stroke();
      // Helmet + visor.
      ctx.fillStyle = '#3c4354';
      ctx.beginPath(); ctx.arc(1, 0, r * 0.56, 0, U.TAU); ctx.fill();
      ctx.fillStyle = '#ffb36b';
      ctx.fillRect(r * 0.18, -r * 0.3, 3.2, r * 0.6);
      if (roll > 0) {
        ctx.strokeStyle = 'rgba(255,138,26,0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, r + 3, roll * U.TAU, roll * U.TAU + 2.2); ctx.stroke();
      }
      ctx.restore();

      if (this.powerups.invuln > 0) {
        const pulse = 0.5 + Math.sin(time * 10) * 0.2;
        ctx.strokeStyle = 'rgba(25,195,221,' + pulse + ')';
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(this.x, this.y, r + 9, 0, U.TAU); ctx.stroke();
      }
      if (this.iframes > 0 && !this.isDodging && Math.floor(time * 20) % 2 === 0) {
        ctx.globalAlpha = 0.25;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(this.x, this.y, r, 0, U.TAU); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    _drawDead(ctx) {
      const t = Math.min(1, this.deathTimer / 0.6);
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle + t * 1.4);
      ctx.globalAlpha = 1 - t * 0.35;
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.beginPath(); ctx.ellipse(4, 4, this.r * 1.5, this.r, 0, 0, U.TAU); ctx.fill();
      ctx.fillStyle = '#2d3343';
      ctx.beginPath(); ctx.ellipse(0, 0, this.r * (1 + t * 0.2), this.r * 0.8, 0, 0, U.TAU); ctx.fill();
      ctx.fillStyle = '#7a4a24';
      ctx.beginPath(); ctx.arc(this.r * 0.6, 0, this.r * 0.5, 0, U.TAU); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  Player.ACCENT = ACCENT;
  Player.POWERUP_DURATION = POWERUP_DURATION;
  BO.Player = Player;
})(window.BO);

/* =========================================================================

(function (BO) {

    grunt: {

      retreatAt: 0, weaponLen: 0, dropChance: 0.25, prefRange: 0, range: 40
    },

      bulletSpeed: 660, range: 560, prefRange: 210, view: 500, fov: 1.7, turn: 2.2, xp: 60, credits: [18, 30],
      color: '#ff4a3d', body: '#3a2f2c', knockResist: 0.2, retreatAt: 0, weaponLen: 30, sound: 'heavy', dropChance: 0.9
    },
    sniper: {

      spread: 0.004, range: 1300, prefRange: 650, minRange: 330, view: 1150, fov: 1.15, turn: 3.2, xp: 40,
      credits: [10, 18], color: '#ff2d55', body: '#2f2a36', knockResist: 1, retreatAt: 0.99, weaponLen: 36, sound: 'esniper', dropChance: 0.4

  class Enemy {
    constructor(type, x, y, difficulty) {

      this.patrol = [];
      this.patrolIndex = 0;

      this.charge = 0; this.lockedAngle = 0;

      this.windup = 0; this.lunge = 0; this.meleeCooldown = 0; this.meleeHit = false;
      this.strafeDir = U.chance(0.5) ? 1 : -1; this.strafeTimer = U.rand(1, 2);

    /** Returns true if this hit killed the enemy. */

    /* ------------------------------ Render ------------------------------ */
    draw(ctx, time) {

      ctx.fillStyle = flash ? '#fff' : '#4d3a44';
      ctx.beginPath(); ctx.arc(1, 0, r * 0.55, 0, U.TAU); ctx.fill();

      ctx.fillRect(12, 1, 10, 3);

      ctx.beginPath(); ctx.moveTo(-r, -r * 0.9); ctx.lineTo(r * 0.2, -r * 0.6); ctx.lineTo(r * 0.2, r * 0.6); ctx.lineTo(-r, r * 0.9); ctx.fill();

      ctx.beginPath(); ctx.arc(r * 0.35, 0, 2.6, 0, U.TAU); ctx.fill();
    }

    _drawCorpse(ctx) {
      const t = Math.min(1, this.deathTime / 0.35);
      const fade = this.removeTimer < 1 ? this.removeTimer : 1;
      ctx.globalAlpha = 0.85 * fade;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle + t * 0.8);
      ctx.fillStyle = '#17161b';
      ctx.beginPath(); ctx.ellipse(0, 0, this.r * (1 + t * 0.15), this.r * 0.75, 0, 0, U.TAU); ctx.fill();
      ctx.fillStyle = U.rgba(this.def.color, 0.35 * (1 - t * 0.6));
      ctx.beginPath(); ctx.arc(this.r * 0.3, 0, this.r * 0.35, 0, U.TAU); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    /** Drawn above the darkness layer: visor glow, alert icons, health bar, sniper laser. */
    drawOverlay(ctx, time, game) {
      if (this.dead) return;
      if (this.type === 'sniper' && this.charge > 0) this._drawLaser(ctx, time, game);
      if (this.type === 'rusher' && this.windup > 0) {
        ctx.strokeStyle = 'rgba(255,92,122,0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.def.meleeRange + this.r + 6, this.angle - 0.8, this.angle + 0.8); ctx.stroke();
      }
      if (this.type === 'heavy' && this.spin > 0 && this.sprayLeft <= 0) {
        ctx.globalAlpha = this.spin;
        ctx.strokeStyle = '#ff4a3d';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([6, 8]);
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x + Math.cos(this.angle) * 200, this.y + Math.sin(this.angle) * 200);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
      }
      if (!this.visible) return;
      // Visor glow pierces the dark so lit enemies read instantly.
      const vx = this.x + Math.cos(this.angle) * this.r * 0.4, vy = this.y + Math.sin(this.angle) * this.r * 0.4;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.65;
      ctx.drawImage(BO.softSprite(this.def.color), vx - 14, vy - 14, 28, 28);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      if (this.barTimer > 0 || this.hp < this.maxHp) {
        const w = Math.max(28, this.r * 2.2), h = 4;
        const x = this.x - w / 2, y = this.y - this.r - 14;
        ctx.globalAlpha = Math.min(1, 0.45 + this.barTimer);
        ctx.fillStyle = 'rgba(6,7,16,0.8)';
        ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
        ctx.fillStyle = this.def.color;
        ctx.fillRect(x, y, w * (this.hp / this.maxHp), h);
        ctx.globalAlpha = 1;

      let icon = null, color = '#ffd34d';
      if (this.state === S.ALERT || this.state === S.INVESTIGATE || this.state === S.SEARCH) icon = '?';
      else if (this.engaged && this.stateTime < 1.2) { icon = '!'; color = '#ff3355'; }
      if (icon) {
        const bob = Math.sin(time * 8) * 2;
        ctx.font = '700 20px Khand, "Chakra Petch", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(5,6,14,0.9)';
        ctx.strokeText(icon, this.x, this.y - this.r - 28 + bob);
        ctx.fillStyle = color;
        ctx.fillText(icon, this.x, this.y - this.r - 28 + bob);
        if (icon === '?' && this.state === S.ALERT) {
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(this.x, this.y - this.r - 28, 12, -Math.PI / 2, -Math.PI / 2 + U.TAU * this.awareness); ctx.stroke();
        }
      }
    }

    _drawLaser(ctx, time, game) {
      const prog = U.clamp(this.charge / this.def.chargeTime, 0, 1);
      const locked = prog >= 1 - this.def.lockTime / this.def.chargeTime;
      const a = locked ? this.lockedAngle : this.angle;
      const sx = this.x + Math.cos(a) * 20, sy = this.y + Math.sin(a) * 20;
      const hit = BO.Collision.raycast(game.map, sx, sy, sx + Math.cos(a) * this.def.range, sy + Math.sin(a) * this.def.range, BO.COLLIDE.BULLET);
      const flicker = locked ? (Math.floor(time * 30) % 2 ? 1 : 0.4) : 0.35 + prog * 0.5;
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = U.rgba('#ff2d55', flicker);
      ctx.lineWidth = locked ? 2.5 : 1 + prog;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(hit.x, hit.y); ctx.stroke();
      ctx.globalAlpha = 0.6 * flicker;
      ctx.drawImage(BO.softSprite('#ff2d55'), hit.x - 10, hit.y - 10, 20, 20);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  BO.ENEMY_TYPES = ENEMY_TYPES;
  BO.ENEMY_STATE = STATE;
  BO.Enemy = Enemy;
})(window.BO);
