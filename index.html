<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="BLACKOUT // خاموشی - a top-down tactical shooter played in the dark.">
  <title>BLACKOUT // خاموشی</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" aria-label="BLACKOUT game canvas"></canvas>

  <div id="ui">
    <!-- MAIN MENU -->
    <section class="screen" data-screen="menu">
      <div class="lang-switch">
        <button data-action="lang" data-value="fa">فارسی</button>
        <button data-action="lang" data-value="en">EN</button>
      </div>
      <div class="menu-col">
        <header class="title-block">
          <h1 class="title" aria-label="BLACKOUT"><span>BLACK</span><span class="flicker">O</span><span>UT</span></h1>
          <div class="title-fa">خاموشی</div>
          <div class="subtitle" data-i18n="game.subtitle"></div>
        </header>
        <nav class="menu-nav">
          <button class="nav primary-nav" data-action="play" data-i18n="menu.play"></button>
          <button class="nav" data-action="missions" data-i18n="menu.missions"></button>
          <button class="nav" data-action="loadout" data-i18n="menu.loadout"></button>
          <button class="nav" data-action="upgrades" data-i18n="menu.upgrades"></button>
          <button class="nav" data-action="settings" data-i18n="menu.settings"></button>
          <button class="nav" data-action="credits" data-i18n="menu.credits"></button>
          <button class="nav" data-action="quit" data-i18n="menu.quit"></button>
        </nav>
        <div class="next-op" id="menu-next"></div>
        <footer class="profile">
          <div class="p-level"><span data-i18n="common.level"></span><b id="profile-level"></b></div>
          <div class="p-xp"><div class="p-xp-label"><span data-i18n="common.xp"></span><span id="profile-xp"></span></div><div class="xpbar"><i id="profile-xpbar"></i></div></div>
          <div class="p-credits"><span data-i18n="common.credits"></span><b id="profile-credits"></b></div>
        </footer>
      </div>
    </section>

    <!-- MISSIONS -->
    <section class="screen panel-screen" data-screen="missions">
      <div class="panel wide">
        <header class="panel-head"><h2 data-i18n="missions.title"></h2></header>
        <div class="mission-list" id="mission-list"></div>
        <footer class="panel-foot"><button class="btn" data-action="back" data-i18n="common.back"></button></footer>
      </div>
    </section>

    <!-- LOADOUT -->
    <section class="screen panel-screen" data-screen="loadout">
      <div class="panel wide">
        <header class="panel-head">
          <h2 data-i18n="loadout.title"></h2>
          <span class="head-mission" id="loadout-mission"></span>
          <span class="head-credits"><span data-i18n="common.credits"></span> <b id="loadout-credits"></b></span>
        </header>
        <div class="tabs">
          <button class="tab" data-action="tab" data-tab="primary" data-i18n="loadout.primary"></button>
          <button class="tab" data-action="tab" data-tab="secondary" data-i18n="loadout.secondary"></button>
        </div>
        <div class="loadout-body">
          <div class="weapon-list" id="weapon-list"></div>
          <div class="weapon-detail">
            <canvas id="wd-canvas" width="360" height="120"></canvas>
            <h3 id="wd-name"></h3>
            <p id="wd-desc"></p>
            <div class="stats" id="wd-stats"></div>
            <button class="btn primary" id="wd-action" data-action="equip"></button>
          </div>
        </div>
        <footer class="panel-foot">
          <button class="btn" data-action="back" data-i18n="common.back"></button>
          <button class="btn primary big" id="loadout-deploy" data-action="deploy" data-i18n="common.deploy"></button>
        </footer>
      </div>
    </section>

    <!-- UPGRADES -->
    <section class="screen panel-screen" data-screen="upgrades">
      <div class="panel">
        <header class="panel-head">
          <h2 data-i18n="up.title"></h2>
          <span class="head-credits"><span data-i18n="common.credits"></span> <b id="upgrade-credits"></b></span>
        </header>
        <div class="upgrade-list" id="upgrade-list"></div>
        <footer class="panel-foot">
          <button class="btn" data-action="back" data-i18n="common.back"></button>
          <button class="btn primary big" id="upgrades-next" data-action="to-loadout" data-i18n="res.next"></button>
        </footer>
      </div>
    </section>

    <!-- SETTINGS -->
    <section class="screen panel-screen" data-screen="settings">
      <div class="panel">
        <header class="panel-head"><h2 data-i18n="set.title"></h2></header>
        <div class="settings">
          <label class="row"><span data-i18n="set.master"></span><input type="range" min="0" max="1" step="0.01" data-setting="master"><output data-setting-label="master"></output></label>
          <label class="row"><span data-i18n="set.music"></span><input type="range" min="0" max="1" step="0.01" data-setting="music"><output data-setting-label="music"></output></label>
          <label class="row"><span data-i18n="set.sfx"></span><input type="range" min="0" max="1" step="0.01" data-setting="sfx"><output data-setting-label="sfx"></output></label>
          <label class="row"><span data-i18n="set.sensitivity"></span><input type="range" min="0.2" max="3" step="0.05" data-setting="sensitivity"><output data-setting-label="sensitivity"></output></label>
          <div class="row"><span data-i18n="set.shake"></span><button class="toggle" data-action="toggle" data-key="screenShake"></button></div>
          <div class="row"><span data-i18n="set.particles"></span>
            <div class="seg">
              <button data-action="particles" data-value="low" data-i18n="set.low"></button>
              <button data-action="particles" data-value="medium" data-i18n="set.medium"></button>
              <button data-action="particles" data-value="high" data-i18n="set.high"></button>
            </div>
          </div>
          <div class="row"><span data-i18n="set.postfx"></span><button class="toggle" data-action="toggle" data-key="postfx"></button></div>
          <div class="row"><span data-i18n="set.voice"></span><button class="toggle" data-action="toggle" data-key="voice"></button></div>
          <div class="row"><span data-i18n="set.blood"></span><button class="toggle" data-action="toggle" data-key="blood"></button></div>
          <div class="row"><span data-i18n="set.fullscreen"></span><button class="toggle" data-action="fullscreen"></button></div>
          <div class="row"><span data-i18n="set.fps"></span><button class="toggle" data-action="toggle" data-key="fps"></button></div>
          <div class="row"><span data-i18n="set.language"></span>
            <div class="seg">
              <button data-action="lang" data-value="fa">فارسی</button>
              <button data-action="lang" data-value="en">English</button>
            </div>
          </div>
          <div class="row danger"><button class="btn danger" data-action="reset" data-i18n="set.reset"></button></div>
        </div>
        <footer class="panel-foot"><button class="btn" data-action="settings-back" data-i18n="common.back"></button></footer>
      </div>
    </section>

    <!-- CREDITS -->
    <section class="screen panel-screen" data-screen="credits">
      <div class="panel narrow">
        <header class="panel-head"><h2 data-i18n="credits.title"></h2></header>
        <div class="credits-body" data-i18n-lines="credits.body"></div>
        <footer class="panel-foot"><button class="btn" data-action="back" data-i18n="common.back"></button></footer>
      </div>
    </section>

    <!-- QUIT -->
    <section class="screen center-screen" data-screen="quit">
      <h2 class="big-title" data-i18n="quit.title"></h2>
      <p data-i18n="quit.body"></p>
      <button class="btn" data-action="quit-return" data-i18n="quit.return"></button>
    </section>

    <!-- PAUSE -->
    <section class="screen center-screen dim" data-screen="pause">
      <h2 class="big-title" data-i18n="pause.title"></h2>
      <nav class="menu-nav compact">
        <button class="nav primary-nav" data-action="resume" data-i18n="pause.resume"></button>
        <button class="nav" data-action="restart" data-i18n="pause.restart"></button>
        <button class="nav" data-action="pause-settings" data-i18n="pause.settings"></button>
        <button class="nav" data-action="quit-menu" data-i18n="pause.quit"></button>
      </nav>
    </section>

    <!-- RESULTS -->
    <section class="screen center-screen dim" data-screen="results">
      <div class="results">
        <div class="res-head">
          <div>
            <div class="res-mission" id="res-mission"></div>
            <h2 class="big-title" id="res-title"></h2>
          </div>
          <div class="rating"><span data-i18n="res.rating"></span><b id="res-rating"></b></div>
        </div>
        <div class="res-stats" id="res-stats"></div>
        <div class="res-actions">
          <button class="btn" data-action="back" data-i18n="res.menu"></button>
          <button class="btn" data-action="retry" data-i18n="res.replay"></button>
          <button class="btn" id="res-upgrades" data-action="results-upgrades" data-i18n="res.upgrades"></button>
          <button class="btn primary big" id="res-next" data-action="next" data-i18n="res.next"></button>
        </div>
      </div>
    </section>

    <!-- DEATH -->
    <section class="screen center-screen dim red" data-screen="death">
      <div class="results">
        <div class="res-mission" id="death-mission"></div>
        <h2 class="big-title kia" data-i18n="res.kia"></h2>
        <p class="kia-sub" data-i18n="res.kiaSub"></p>
        <div class="res-stats" id="death-stats"></div>
        <div class="res-actions">
          <button class="btn" data-action="back" data-i18n="res.menu"></button>
          <button class="btn" data-action="upgrades" data-i18n="res.upgrades"></button>
          <button class="btn primary big" data-action="retry" data-i18n="res.retry"></button>
        </div>
      </div>
    </section>

    <div id="confirm" class="confirm">
      <div class="confirm-box">
        <p id="confirm-text"></p>
        <div class="res-actions">
          <button class="btn" data-action="confirm-no" data-i18n="common.cancel"></button>
          <button class="btn danger" data-action="confirm-yes" data-i18n="common.confirm"></button>
        </div>
      </div>
    </div>
    <div id="toast" class="toast" role="status"></div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/save.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/collision.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/projectiles.js"></script>
  <script src="js/player.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/boss.js"></script>
  <script src="js/hazards.js"></script>
  <script src="js/pickups.js"></script>
  <script src="js/objectives.js"></script>
  <script src="js/missions.js"></script>
  <script src="js/level.js"></script>
  <script src="js/upgrades.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <!-- Expansion packs: extra strings, new weapons, new missions, graphics overhaul -->
  <script src="js/i18n-extra.js"></script>
  <script src="js/arsenal.js"></script>
  <script src="js/campaign.js"></script>
  <script src="js/postfx.js"></script>
  <!-- v3 overhaul: sound, effects, character models -->
  <script src="js/audio-plus.js"></script>
  <script src="js/fx-plus.js"></script>
  <script src="js/characters-plus.js"></script>
  <!-- v4 expansion: shake, guns, enemy types, missions, Persian voices, blood, walls -->
  <script src="js/v4-core.js"></script>
  <script src="js/v4-shake.js"></script>
  <script src="js/v4-arsenal.js"></script>
  <script src="js/v4-enemies.js"></script>
  <script src="js/v4-campaign.js"></script>
  <script src="js/v4-voice.js"></script>
  <script src="js/v4-blood.js"></script>
  <script src="js/v4-walls.js"></script>
  <!-- v7 expansion: environments & hazards, 8 weapons, 10 missions (m15-m24) -->
  <script src="js/v7-world.js"></script>
  <script src="js/v7-arsenal.js"></script>
  <script src="js/v7-campaign.js"></script>
  <!-- v6: shared input layer, gamepads, touch controls, local co-op (order matters) -->
  <script src="js/v6-core.js"></script>
  <script src="js/v6-gamepad.js"></script>
  <script src="js/v6-touch.js"></script>
  <script src="js/v6-coop.js"></script>
  <script src="js/v6-remote.js"></script>
  <!-- v5: local multi-profile support (must load before main.js) -->
  <script src="js/profiles.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
